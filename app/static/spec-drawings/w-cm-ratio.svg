<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Water to cementitious materials ratio: mass of water divided by mass of cement plus supplementary materials"><title>Water to cementitious materials ratio: mass of water divided by mass of cement plus supplementary materials</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M180 112L164 150L196 150Z" style="fill:var(--grid)"/><path d="M150 150L210 150"/><path d="M70 110L290 110" stroke-width="2.5"/><circle cx="180" cy="110" r="2.5" fill="currentColor" stroke="none"/><path d="M45 160L80 110L115 160" stroke-width="1"/><path d="M245 160L280 110L315 160" stroke-width="1"/><path d="M40 160L120 160" stroke-width="2"/><path d="M240 160L320 160" stroke-width="2"/><path d="M60 158L64 128L96 128L100 158Z"/><path d="M61.5 146L96.5 146L99 157H61Z" style="fill:var(--series-1);fill-opacity:.15;stroke:none"/><path d="M62 146q2.8 -1.5 5.5 0t5.5 0q2.8 -1.5 5.5 0t5.5 0q2.8 -1.5 5.5 0t5.5 0q2.8 -1.5 5.5 0t5.5 0" style="stroke:var(--series-1)"/><path d="M248 158L250 130Q257 124 263 128Q269 124 276 130L278 158Z" style="fill:var(--grid)"/><path d="M282 158L284 130Q291 124 297 128Q303 124 310 130L312 158Z" style="fill:var(--grid)"/></g><g fill="currentColor" font-size="11" font-family="inherit"><text x="80" y="180" text-anchor="middle">water</text><text x="280" y="180" text-anchor="middle">cement + SCMs</text><text x="180" y="30" text-anchor="middle" font-weight="600">w/cm = mass of water ÷ mass of cementitious</text><text x="180" y="48" text-anchor="middle">lower w/cm: stronger, less permeable</text><text x="180" y="205" text-anchor="middle">e.g. 180 kg ÷ 400 kg = 0.45</text></g></svg>
