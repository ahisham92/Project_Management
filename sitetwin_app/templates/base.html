<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SiteTwin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='sitetwin.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('home') }}">SiteTwin<span>Construction sequence</span></a>
    {% if who %}<span class="who">{{ who['name'] }}</span>{% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
