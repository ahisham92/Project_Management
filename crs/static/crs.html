<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRS Review</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --muted:#6b7a89; --line:#dfe5ec;
  --accent:#0f4c81; --open:#b45309; --open-bg:#fef3c7; --closed:#166534; --closed-bg:#dcfce7;
  --late:#b42318; --late-bg:#fee4e2; --draft:#5b21b6; --draft-bg:#ede9fe; --danger:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:var(--accent);color:#fff;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.02em;cursor:pointer}
.who{display:flex;gap:8px;align-items:center}
.who input,.who select{padding:5px 8px;border:0;border-radius:4px;font:inherit;font-size:14px}
main{max-width:1160px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:20px}
h1{font-size:20px;margin:4px 0 8px}
h2{font-size:16px;margin:18px 0 12px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:12px 0}
.back{font-size:13px;color:var(--accent);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.center{text-align:center}
.late-text{color:var(--late);font-weight:600}
button,.button{font:inherit;cursor:pointer}
.button,button.primary{display:inline-block;padding:8px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:14px}
button.ghost{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--accent);font-size:14px}
button.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:inherit}
button.link.danger{color:var(--danger)}
button[disabled]{opacity:.5;cursor:not-allowed}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.exports{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0 8px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);padding:8px}
table.list td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
table.list td.text{max-width:420px}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:#f8fafc}
table.list input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px}
tr.is-closed td{background:#fbfdfb}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:0;cursor:pointer}
.chip.open{background:var(--open-bg);color:var(--open)}
.chip.closed{background:var(--closed-bg);color:var(--closed)}
.chip.late{background:var(--late-bg);color:var(--late)}
.chip.draft{background:var(--draft-bg);color:var(--draft)}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 20px;margin:14px 0 0}
.info dt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.info dd{margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fbfcfd}
.tile-value{font-size:26px;font-weight:600;line-height:1.1}
.tile-label{font-size:12px;color:var(--muted);margin-top:4px}
.tile.open .tile-value{color:var(--open)}
.tile.closed .tile-value{color:var(--closed)}
.tile.late{background:var(--late-bg);border-color:#fbc9c4}
.tile.late .tile-value{color:var(--late)}
.tile.draft .tile-value{color:var(--draft)}
.late-list ul{margin:0;padding-left:18px}
.late-list li{margin-bottom:4px;font-size:14px}
.filters{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:5px 12px;border-radius:999px;color:var(--muted);font-size:13px;border:1px solid var(--line);background:#fff}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.search{margin-left:auto;display:flex;gap:6px}
.search input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.observation{font-size:16px;margin:12px 0;white-space:pre-wrap}
.assign{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.assign label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.assign select,.assign input{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
.assign-contact{font-size:14px;padding-bottom:7px}
.thread{list-style:none;margin:0 0 20px;padding:0}
.msg{border-left:3px solid var(--line);padding:8px 0 8px 14px;margin-bottom:14px}
.msg.designer,.msg.designer-pm{border-left-color:var(--accent)}
.msg.reviewer{border-left-color:var(--open)}
.msg.is-draft{border-left-style:dashed;border-left-color:var(--draft)}
.msg-head{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.msg-head .role{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.msg-body{margin-top:4px;white-space:pre-wrap}
.msg-actions{margin-top:6px;font-size:13px}
.attachments{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;align-items:flex-start}
.thumb{margin:0;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff;max-width:200px}
.thumb img{display:block;width:100%;border-radius:4px}
.thumb figcaption{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.file-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:#fff}
textarea,.grid-form input,.grid-form select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.attach-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.reply-actions{display:flex;gap:16px;align-items:center;margin-top:10px;flex-wrap:wrap}
.reply-actions label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.reply-actions select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;width:auto}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.grid-form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid-form .wide{grid-column:1/-1}
.grid-form button{justify-self:start}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mode{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;cursor:pointer}
.mode.on{border-color:var(--accent);background:#f5f9fd}
.mode input{grid-row:span 2}
.mode span{font-size:13px;color:var(--muted)}
.inline-field{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px}
.inline-field input{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit}
details summary{cursor:pointer;font-weight:600}
.flash{padding:10px 14px;border-radius:6px;margin-bottom:8px;font-size:14px}
.flash.ok{background:var(--closed-bg);color:var(--closed)}
.flash.error{background:var(--late-bg);color:var(--danger)}
.flash.warn{background:var(--open-bg);color:var(--open)}
.hidden{display:none}
.who-name{font-weight:600}
.who-role{font-size:12px;opacity:.85;border:1px solid #ffffff55;border-radius:999px;padding:2px 10px}
button.link.light{color:#fff;opacity:.9}
.auth{max-width:520px;margin:40px auto 20px}
.auth-tabs{display:flex;gap:8px;margin:12px 0 4px}
.chip.admin{background:#e0e7ff;color:#3730a3}
.send-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
code{background:#f1f5f9;border-radius:4px;padding:1px 6px;font-size:12px}
table.list select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff;width:100%}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand">CRS Review</div>
  <div class="who" id="user-bar"></div>
</header>

<main>
  <div id="flashes"></div>
  <div id="view"></div>
</main>

<input type="file" id="file-input" accept=".xlsx,.xlsm" class="hidden">

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * ZIP: read and write .xlsx packages.
 * Parts we do not touch are copied through still compressed, so an
 * exported file differs from the original only where we changed it.
 * ------------------------------------------------------------------ */
const ZIP = (() => {
  const TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  async function through(bytes, stream) {
    const piped = new Blob([bytes]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(piped).arrayBuffer());
  }
  const deflate = bytes => through(bytes, new CompressionStream("deflate-raw"));
  const inflate = bytes => through(bytes, new DecompressionStream("deflate-raw"));

  async function read(buffer) {
    const u8 = new Uint8Array(buffer);
    const dv = new DataView(buffer);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("This is not a valid Excel file (no zip directory found).");
    const count = dv.getUint16(eocd + 10, true);
    if (count === 0xFFFF) throw new Error("This Excel file uses zip64, which this page cannot read.");
    let p = dv.getUint32(eocd + 16, true);
    const entries = [];
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("Damaged zip directory in this file.");
      const entry = {
        flags: dv.getUint16(p + 8, true),
        method: dv.getUint16(p + 10, true),
        time: dv.getUint16(p + 12, true),
        date: dv.getUint16(p + 14, true),
        crc: dv.getUint32(p + 16, true),
        csize: dv.getUint32(p + 20, true),
        usize: dv.getUint32(p + 24, true),
        offset: dv.getUint32(p + 42, true),
      };
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      entry.name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
      const localNameLen = dv.getUint16(entry.offset + 26, true);
      const localExtraLen = dv.getUint16(entry.offset + 28, true);
      const start = entry.offset + 30 + localNameLen + localExtraLen;
      entry.compressed = u8.slice(start, start + entry.csize);
      entries.push(entry);
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  async function bytesOf(entry) {
    if (entry.bytes) return entry.bytes;
    entry.bytes = entry.method === 0 ? entry.compressed : await inflate(entry.compressed);
    return entry.bytes;
  }

  async function replace(entry, bytes) {
    entry.bytes = bytes;
    entry.compressed = await deflate(bytes);
    entry.method = 8;
    entry.crc = crc32(bytes);
    entry.usize = bytes.length;
    entry.csize = entry.compressed.length;
    entry.flags &= 0x800;
    return entry;
  }

  async function makeEntry(name, bytes) {
    const now = new Date();
    const entry = {
      name, flags: 0, method: 8, crc: 0, csize: 0, usize: 0,
      time: ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF,
      date: (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF,
    };
    return replace(entry, bytes);
  }

  function write(entries) {
    const encoder = new TextEncoder();
    const names = entries.map(e => encoder.encode(e.name));
    let size = 22;
    entries.forEach((e, i) => { size += 30 + names[i].length + e.csize + 46 + names[i].length; });
    const out = new Uint8Array(size);
    const dv = new DataView(out.buffer);
    let offset = 0;
    const offsets = [];
    entries.forEach((e, i) => {
      offsets.push(offset);
      dv.setUint32(offset, 0x04034b50, true);
      dv.setUint16(offset + 4, 20, true);
      dv.setUint16(offset + 6, e.flags, true);
      dv.setUint16(offset + 8, e.method, true);
      dv.setUint16(offset + 10, e.time, true);
      dv.setUint16(offset + 12, e.date, true);
      dv.setUint32(offset + 14, e.crc, true);
      dv.setUint32(offset + 18, e.csize, true);
      dv.setUint32(offset + 22, e.usize, true);
      dv.setUint16(offset + 26, names[i].length, true);
      dv.setUint16(offset + 28, 0, true);
      out.set(names[i], offset + 30);
      out.set(e.compressed, offset + 30 + names[i].length);
      offset += 30 + names[i].length + e.csize;
    });
    const dirStart = offset;
    entries.forEach((e, i) => {
      dv.setUint32(offset, 0x02014b50, true);
      dv.setUint16(offset + 4, 20, true);
      dv.setUint16(offset + 6, 20, true);
      dv.setUint16(offset + 8, e.flags, true);
      dv.setUint16(offset + 10, e.method, true);
      dv.setUint16(offset + 12, e.time, true);
      dv.setUint16(offset + 14, e.date, true);
      dv.setUint32(offset + 16, e.crc, true);
      dv.setUint32(offset + 20, e.csize, true);
      dv.setUint32(offset + 24, e.usize, true);
      dv.setUint16(offset + 28, names[i].length, true);
      dv.setUint16(offset + 30, 0, true);
      dv.setUint16(offset + 32, 0, true);
      dv.setUint16(offset + 34, 0, true);
      dv.setUint16(offset + 36, 0, true);
      dv.setUint32(offset + 38, 0, true);
      dv.setUint32(offset + 42, offsets[i], true);
      out.set(names[i], offset + 46);
      offset += 46 + names[i].length;
    });
    dv.setUint32(offset, 0x06054b50, true);
    dv.setUint16(offset + 8, entries.length, true);
    dv.setUint16(offset + 10, entries.length, true);
    dv.setUint32(offset + 12, offset - dirStart, true);
    dv.setUint32(offset + 16, dirStart, true);
    dv.setUint16(offset + 20, 0, true);
    return out;
  }

  return { read, write, bytesOf, replace, makeEntry };
})();

/* ------------------------------------------------------------------ *
 * Spreadsheet plumbing
 * ------------------------------------------------------------------ */
const MAIN = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const PKGREL = "http://schemas.openxmlformats.org/package/2006/relationships";
const XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
const EMU = 9525; // EMU per pixel

const colIndex = letters => [...letters].reduce((n, ch) => n * 26 + (ch.charCodeAt(0) - 64), 0);
const colLetter = index => {
  let out = "", n = index;
  while (n > 0) { const rem = (n - 1) % 26; out = String.fromCharCode(65 + rem) + out; n = (n - rem - 1) / 26; }
  return out;
};
/* Relationship targets come as "worksheets/sheet1.xml", "/xl/worksheets/sheet1.xml"
   or "../media/image1.png" depending on who wrote the file. */
const resolvePart = (target, base = "xl/") => {
  const clean = (target || "").replace(/\\/g, "/");
  if (!clean) return "";
  if (clean.startsWith("/")) return clean.replace(/^\/+/, "");
  if (clean.startsWith("../")) return "xl/" + clean.replace(/^(\.\.\/)+/, "");
  if (clean.startsWith("xl/")) return clean;
  return base + clean;
};

const refParts = ref => { const m = /^([A-Z]+)(\d+)$/.exec(ref || ""); return m ? { col: colIndex(m[1]), row: +m[2] } : null; };

const decode = bytes => new TextDecoder().decode(bytes);
const encode = text => new TextEncoder().encode(text);
const parseXml = text => new DOMParser().parseFromString(text, "application/xml");
const serialize = doc => XML_HEAD + new XMLSerializer().serializeToString(doc.documentElement);
const xmlEscape = text => String(text)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const DATE_FORMATS = new Set([14, 15, 16, 17, 18, 19, 20, 21, 22, 27, 30, 36, 45, 46, 47, 50, 57]);

class Workbook {
  static async open(buffer) {
    const wb = new Workbook();
    wb.entries = await ZIP.read(buffer);
    wb.byName = new Map(wb.entries.map(e => [e.name, e]));
    wb.text = async name => {
      const entry = wb.byName.get(name);
      return entry ? decode(await ZIP.bytesOf(entry)) : null;
    };

    const workbookXml = await wb.text("xl/workbook.xml");
    if (!workbookXml) throw new Error("This file is not an Excel workbook.");
    wb.relsXml = await wb.text("xl/_rels/workbook.xml.rels");
    wb.workbookXml = workbookXml;
    wb.typesXml = await wb.text("[Content_Types].xml");

    const targets = new Map();
    for (const rel of parseXml(wb.relsXml).getElementsByTagNameNS(PKGREL, "Relationship")) {
      targets.set(rel.getAttribute("Id"), rel.getAttribute("Target"));
    }
    wb.sheets = [...parseXml(workbookXml).getElementsByTagNameNS(MAIN, "sheet")].map(sheet => {
      const target = targets.get(sheet.getAttributeNS(REL, "id")) || "";
      return {
        name: sheet.getAttribute("name"),
        relId: sheet.getAttributeNS(REL, "id"),
        part: resolvePart(target),
      };
    });

    const sharedXml = await wb.text("xl/sharedStrings.xml");
    wb.shared = sharedXml
      ? [...parseXml(sharedXml).getElementsByTagNameNS(MAIN, "si")].map(si =>
          [...si.getElementsByTagNameNS(MAIN, "t")].map(t => t.textContent).join(""))
      : [];

    const stylesXml = await wb.text("xl/styles.xml");
    wb.dateStyles = new Set();
    if (stylesXml) {
      const styles = parseXml(stylesXml);
      const custom = new Map();
      for (const fmt of styles.getElementsByTagNameNS(MAIN, "numFmt")) {
        custom.set(+fmt.getAttribute("numFmtId"), fmt.getAttribute("formatCode") || "");
      }
      const xfs = styles.getElementsByTagNameNS(MAIN, "cellXfs")[0];
      if (xfs) {
        [...xfs.getElementsByTagNameNS(MAIN, "xf")].forEach((xf, i) => {
          const id = +(xf.getAttribute("numFmtId") || 0);
          const code = custom.get(id) || "";
          const looksLikeDate = /[dmyh]/i.test(code.replace(/\[[^\]]*\]|"[^"]*"/g, ""));
          if (DATE_FORMATS.has(id) || (code && looksLikeDate)) wb.dateStyles.add(i);
        });
      }
    }
    return wb;
  }

  async sheetDoc(part) { return parseXml(await this.text(part)); }

  value(cell) {
    if (!cell) return "";
    const type = cell.getAttribute("t");
    if (type === "inlineStr") {
      return [...cell.getElementsByTagNameNS(MAIN, "t")].map(t => t.textContent).join("");
    }
    const v = cell.getElementsByTagNameNS(MAIN, "v")[0];
    if (!v) return "";
    const raw = v.textContent;
    if (type === "s") return this.shared[+raw] ?? "";
    if (type === "str" || type === "e") return raw;
    if (type === "b") return raw === "1" ? "TRUE" : "FALSE";
    const style = +(cell.getAttribute("s") || -1);
    if (this.dateStyles.has(style) && raw !== "" && !isNaN(+raw)) {
      const ms = Date.UTC(1899, 11, 30) + Math.round(+raw) * 86400000;
      return new Date(ms).toISOString().slice(0, 10);
    }
    return raw;
  }

  /* -- package edits ------------------------------------------------ */
  async addPart(name, bytes, override) {
    const entry = await ZIP.makeEntry(name, bytes);
    this.entries.push(entry);
    this.byName.set(name, entry);
    if (override) {
      this.typesXml = this.typesXml.replace("</Types>",
        `<Override PartName="/${name}" ContentType="${override}"/></Types>`);
    }
    return entry;
  }

  ensureDefault(extension, contentType) {
    if (this.typesXml.includes(`Extension="${extension}"`)) return;
    this.typesXml = this.typesXml.replace(/<Types([^>]*)>/,
      `<Types$1><Default Extension="${extension}" ContentType="${contentType}"/>`);
  }

  nextSheetPart() {
    let index = 1;
    while (this.byName.has(`xl/worksheets/sheet${index}.xml`)) index++;
    return { part: `xl/worksheets/sheet${index}.xml`, index };
  }

  /** Add a worksheet, optionally very hidden, optionally with its own rels. */
  async addSheet(name, xml, options = {}) {
    const { part, index } = this.nextSheetPart();
    const relId = "rIdCrs" + index;
    await this.addPart(part, encode(xml),
      "application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml");
    if (options.rels) {
      await this.addPart(`xl/worksheets/_rels/sheet${index}.xml.rels`, encode(options.rels));
    }
    const ids = [...this.workbookXml.matchAll(/sheetId="(\d+)"/g)].map(m => +m[1]);
    const sheetId = (ids.length ? Math.max(...ids) : 0) + 1;
    const state = options.veryHidden ? ' state="veryHidden"' : "";
    this.workbookXml = this.workbookXml.replace("</sheets>",
      `<sheet name="${xmlEscape(name)}" sheetId="${sheetId}"${state} r:id="${relId}"/></sheets>`);
    this.relsXml = this.relsXml.replace("</Relationships>",
      `<Relationship Id="${relId}" Type="${REL}/worksheet" Target="worksheets/sheet${index}.xml"/></Relationships>`);
    this.sheets.push({ name, relId, part });
    return { part, index };
  }

  /** Remove a worksheet this app added, with its rels, drawing and media. */
  async removeSheet(name) {
    const sheet = this.sheets.find(s => s.name === name);
    if (!sheet) return;
    const drop = new Set([sheet.part]);
    const relsPart = sheet.part.replace("worksheets/", "worksheets/_rels/") + ".rels";
    if (this.byName.has(relsPart)) {
      drop.add(relsPart);
      const rels = parseXml(await this.text(relsPart));
      for (const rel of rels.getElementsByTagNameNS(PKGREL, "Relationship")) {
        const target = resolvePart(rel.getAttribute("Target"), "xl/worksheets/");
        if (!target.startsWith("xl/drawings/")) continue;
        drop.add(target);
        const drawingRels = target.replace("drawings/", "drawings/_rels/") + ".rels";
        if (this.byName.has(drawingRels)) {
          drop.add(drawingRels);
          for (const media of parseXml(await this.text(drawingRels)).getElementsByTagNameNS(PKGREL, "Relationship")) {
            const file = resolvePart(media.getAttribute("Target"), "xl/drawings/");
            if (file.startsWith("xl/media/")) drop.add(file);
          }
        }
      }
    }
    this.entries = this.entries.filter(e => !drop.has(e.name));
    drop.forEach(part => {
      this.byName.delete(part);
      this.typesXml = this.typesXml.replace(new RegExp(`<Override PartName="/${part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}"[^>]*/>`), "");
    });
    this.workbookXml = this.workbookXml.replace(
      new RegExp(`<sheet [^>]*name="${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}"[^>]*/>`), "");
    this.relsXml = this.relsXml.replace(
      new RegExp(`<Relationship Id="${sheet.relId}"[^>]*/>`), "");
    this.sheets = this.sheets.filter(s => s.name !== name);
  }

  async flush() {
    await ZIP.replace(this.byName.get("xl/workbook.xml"), encode(this.workbookXml));
    await ZIP.replace(this.byName.get("xl/_rels/workbook.xml.rels"), encode(this.relsXml));
    await ZIP.replace(this.byName.get("[Content_Types].xml"), encode(this.typesXml));
    return ZIP.write(this.entries);
  }
}

/* Index a worksheet DOM so cells can be looked up by row and column. */
function indexSheet(doc) {
  const sheetData = doc.getElementsByTagNameNS(MAIN, "sheetData")[0];
  const rows = new Map();
  for (const row of sheetData.getElementsByTagNameNS(MAIN, "row")) {
    const cells = new Map();
    for (const cell of row.getElementsByTagNameNS(MAIN, "c")) {
      const parts = refParts(cell.getAttribute("r"));
      if (parts) cells.set(parts.col, cell);
    }
    rows.set(+row.getAttribute("r"), { el: row, cells });
  }
  const merges = [...doc.getElementsByTagNameNS(MAIN, "mergeCell")].map(m => {
    const [from, to] = (m.getAttribute("ref") || "").split(":");
    const a = refParts(from), b = refParts(to || from);
    return a && b ? { r1: a.row, c1: a.col, r2: b.row, c2: b.col } : null;
  }).filter(Boolean);
  const maxRow = Math.max(0, ...rows.keys());
  let maxCol = 0;
  rows.forEach(r => r.cells.forEach((_, c) => { if (c > maxCol) maxCol = c; }));
  return { doc, sheetData, rows, merges, maxRow, maxCol };
}

const cellAt = (sheet, row, col) => sheet.rows.get(row)?.cells.get(col) || null;

function mergedCell(sheet, row, col) {
  const direct = cellAt(sheet, row, col);
  if (direct) return direct;
  for (const m of sheet.merges) {
    if (row >= m.r1 && row <= m.r2 && col >= m.c1 && col <= m.c2) return cellAt(sheet, m.r1, m.c1);
  }
  return null;
}

const mergeEndCol = (sheet, row, col) => {
  for (const m of sheet.merges) {
    if (row >= m.r1 && row <= m.r2 && col >= m.c1 && col <= m.c2) return m.c2;
  }
  return col;
};

/* A wrapped, top-aligned twin of an existing cell style, for thread text. */
class Styles {
  constructor(doc) {
    this.doc = doc;
    this.xfs = doc.getElementsByTagNameNS(MAIN, "cellXfs")[0];
    this.cache = new Map();
    this.changed = false;
  }
  wrapped(baseIndex) {
    const key = String(baseIndex ?? "none");
    if (this.cache.has(key)) return this.cache.get(key);
    const list = [...this.xfs.getElementsByTagNameNS(MAIN, "xf")];
    const base = list[+baseIndex] || list[0];
    if (!base) return baseIndex;
    const xf = base.cloneNode(true);
    xf.setAttribute("applyAlignment", "1");
    let alignment = xf.getElementsByTagNameNS(MAIN, "alignment")[0];
    if (!alignment) {
      alignment = this.doc.createElementNS(MAIN, "alignment");
      xf.appendChild(alignment);
    }
    alignment.setAttribute("wrapText", "1");
    alignment.setAttribute("vertical", "top");
    alignment.setAttribute("horizontal", "left");
    this.xfs.appendChild(xf);
    const index = list.length;
    this.xfs.setAttribute("count", String(index + 1));
    this.cache.set(key, index);
    this.changed = true;
    return index;
  }
}

/* ------------------------------------------------------------------ *
 * The CRS form: find the comment table, read it, write it back.
 * ------------------------------------------------------------------ */
const COLUMN_PATTERNS = [
  ["sn", ["s/n", "s.n", "sr no", "serial", "item no"]],
  ["reviewer", ["reviewer's name", "reviewer name", "reviewer", "organization"]],
  ["source", ["identification of comment", "source", "title /page", "clause"]],
  ["observation", ["observations", "comments", "observation"]],
  ["discipline", ["discipline"]],
  ["reference", ["reference number of doc", "reference number", "reference"]],
  ["returned_code", ["returned code", "return code", "code"]],
  ["response", ["response", "reply"]],
  ["signoff", ["sign-off", "sign off", "signoff", "open/closed", "status"]],
];

const INFO_LABELS = [
  ["program_name", ["program name", "programme name"], "Program"],
  ["project_name", ["project name"], "Project"],
  ["project_code", ["project code"], "Project code"],
  ["contractor", ["contractor"], "Contractor"],
  ["report_no", ["report no"], "Report No."],
  ["report_date", ["report date"], "Report date"],
  ["contract_no", ["contract no"], "Contract No."],
  ["drf_ref", ["drf ref"], "DRF Ref."],
  ["drf_rev", ["drf rev"], "DRF Rev."],
  ["drf_date", ["drf date"], "DRF date"],
  ["project_stage", ["project stage"], "Stage"],
  ["engineer", ["engineer in charge"], "Engineer in charge"],
  ["discipline", ["discipline:"], "Discipline"],
  ["doc_title", ["doc or dwg title", "document title"], "Document"],
];

const CODES = { A: "Accepted", B: "Accepted with Comments", C: "Revise and Resubmit", D: "Rejected" };
const DATA_SHEET = "CRS Data";
const REGISTER_SHEET = "Comment Register";
const ATTACHMENT_SHEET = "Attachments";
const APP_SHEETS = [DATA_SHEET, REGISTER_SHEET, ATTACHMENT_SHEET, "Comment Threads"];

const norm = text => (text || "").replace(/\s+/g, " ").trim().toLowerCase();

function findHeaderRow(wb, sheet) {
  for (let row = 1; row <= Math.min(sheet.maxRow, 80); row++) {
    const texts = [];
    for (let col = 1; col <= sheet.maxCol; col++) texts.push(norm(wb.value(cellAt(sheet, row, col))));
    const joined = texts.join(" | ");
    const hasSn = texts.some(t => ["s/n", "s.n", "sn", "sr no"].includes(t));
    if (hasSn && (joined.includes("observation") || joined.includes("comments"))) return row;
  }
  return 0;
}

function mapColumns(wb, sheet, headerRow) {
  const headers = [];
  for (let col = 1; col <= sheet.maxCol; col++) {
    const text = norm(wb.value(mergedCell(sheet, headerRow, col)));
    if (text) headers.push([col, text]);
  }
  const columns = {};
  const used = new Set();
  for (const [field, patterns] of COLUMN_PATTERNS) {
    for (const pattern of patterns) {
      const hit = headers.find(([col, text]) => text.includes(pattern) && !used.has(col));
      if (hit) { columns[field] = colLetter(hit[0]); used.add(hit[0]); break; }
    }
  }
  return columns;
}

const isLabel = text => {
  const t = norm(text);
  return t.endsWith(":") || INFO_LABELS.some(([, patterns]) => patterns.some(p => t === p.replace(/:$/, "").trim()));
};

function readInfo(wb, sheet, headerRow) {
  const info = {};
  for (let row = 1; row < headerRow; row++) {
    for (let col = 1; col <= sheet.maxCol; col++) {
      const label = norm(wb.value(cellAt(sheet, row, col)));
      if (!label) continue;
      const bare = label.replace(/:$/, "").trim();
      for (const [field, patterns] of INFO_LABELS) {
        if (info[field]) continue;
        if (!patterns.some(p => bare === p.replace(/:$/, "").trim() || label.includes(p))) continue;
        const start = mergeEndCol(sheet, row, col) + 1;
        for (let next = start; next <= Math.min(start + 6, sheet.maxCol); next++) {
          const value = wb.value(mergedCell(sheet, row, next));
          if (!value) continue;
          if (!isLabel(value)) info[field] = value;
          break;
        }
        break;
      }
    }
  }
  return info;
}

function lastStyledRow(sheet, lastDataRow, obsCol) {
  const reference = cellAt(sheet, lastDataRow, obsCol);
  const style = reference ? reference.getAttribute("s") : null;
  let last = lastDataRow;
  for (let row = lastDataRow + 1; row <= Math.min(sheet.maxRow, lastDataRow + 200); row++) {
    const cell = cellAt(sheet, row, obsCol);
    if (cell && cell.getAttribute("s") === style) last = row; else break;
  }
  return last;
}

/* A thread entry written into a cell, e.g.
     [2] Ahmed · Reviewer · 2026-09-22
     The municipality letter is still missing.
     Attached: site_photo.jpg
   The numbering runs across both cells, so the two columns read as one
   conversation. The same shape is parsed back when the app reopens a file. */
const ENTRY_HEAD = /^\[(\d+)\]\s*(.*?)\s+·\s+(.*?)\s+·\s+(\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{2})?)(?:\s+·\s+(.*))?$/;

function entryText(number, message) {
  const lines = [`[${number}] ${message.author} · ${message.role} · ${message.at}` +
    (message.organization ? ` · ${message.organization}` : "")];
  lines.push(message.body);
  const files = (message.attachments || []).map(a => a.name);
  if (files.length) lines.push("Attached: " + files.join(", "));
  return lines.join("\n");
}

function threadCells(comment) {
  const published = (comment.messages || []).filter(m => m.published !== false);
  const reviewerParts = [comment.observation || ""];
  const designerParts = [];
  const original = (comment.originalResponse || "").trim();
  if (original) designerParts.push(original);
  published.forEach((message, index) => {
    const text = entryText(index + 1, message);
    (message.role === "Designer" || message.role === "Designer PM" ? designerParts : reviewerParts).push(text);
  });
  const files = (comment.attachments || []).map(a => a.name);
  if (files.length) reviewerParts.push("Attached: " + files.join(", "));
  return {
    observation: reviewerParts.filter(Boolean).join("\n\n"),
    response: designerParts.filter(Boolean).join("\n\n"),
  };
}

/* Rebuild a thread from cell text, for a file that lost its data sheet
   (someone opened the working copy in Excel and saved it). */
function parseThreadCell(text, fallbackRole) {
  const lines = String(text || "").split(/\r?\n/);
  const messages = [];
  let head = null, body = [];
  const flush = () => {
    if (!head) return;
    const attachLine = body.findIndex(l => /^Attached:\s*/i.test(l));
    let attachments = [];
    if (attachLine >= 0) {
      attachments = body[attachLine].replace(/^Attached:\s*/i, "").split(",")
        .map(n => ({ name: n.trim(), kind: "file", missing: true })).filter(a => a.name);
      body.splice(attachLine, 1);
    }
    messages.push({
      number: head.number,
      author: head.author,
      role: head.role || fallbackRole,
      at: head.at,
      organization: head.organization || "",
      body: body.join("\n").trim(),
      attachments,
      published: true,
    });
    head = null; body = [];
  };
  const preamble = [];
  for (const line of lines) {
    const match = ENTRY_HEAD.exec(line.trim());
    if (match) {
      flush();
      head = { number: +match[1], author: match[2], role: match[3], at: match[4], organization: match[5] || "" };
    } else if (head) {
      body.push(line);
    } else {
      preamble.push(line);
    }
  }
  flush();
  return { preamble: preamble.join("\n").trim(), messages };
}

/* -- reading a workbook -------------------------------------------- */

async function readDataSheet(wb) {
  const info = wb.sheets.find(s => s.name === DATA_SHEET);
  if (!info) return null;
  const sheet = indexSheet(await wb.sheetDoc(info.part));
  let base64 = "";
  for (let row = 1; row <= sheet.maxRow; row++) base64 += wb.value(cellAt(sheet, row, 1)) || "";
  if (!base64) return null;
  try {
    return JSON.parse(new TextDecoder().decode(base64ToBytes(base64)));
  } catch (err) {
    return null;
  }
}

async function readRegisterSheet(wb) {
  const info = wb.sheets.find(s => s.name === REGISTER_SHEET);
  if (!info) return new Map();
  const sheet = indexSheet(await wb.sheetDoc(info.part));
  const rows = new Map();
  for (let row = 2; row <= sheet.maxRow; row++) {
    const sn = wb.value(cellAt(sheet, row, 1));
    if (!sn) continue;
    rows.set(String(sn).trim(), {
      trade: wb.value(cellAt(sheet, row, 2)),
      assignee: wb.value(cellAt(sheet, row, 3)),
      email: wb.value(cellAt(sheet, row, 4)),
      due: wb.value(cellAt(sheet, row, 5)),
    });
  }
  return rows;
}

/* Photos live in the Attachments sheet's drawing; pull them back out so a
   file that lost its data sheet still shows its pictures. */
async function readPhotos(wb) {
  const info = wb.sheets.find(s => s.name === ATTACHMENT_SHEET);
  if (!info) return new Map();
  const relsPart = info.part.replace(/([^/]+)$/, "_rels/$1.rels");
  if (!wb.byName.has(relsPart)) return new Map();
  const rels = parseXml(await wb.text(relsPart));
  const drawing = [...rels.getElementsByTagNameNS(PKGREL, "Relationship")]
    .map(r => resolvePart(r.getAttribute("Target"), "xl/worksheets/"))
    .find(t => t.startsWith("xl/drawings/"));
  if (!drawing || !wb.byName.has(drawing)) return new Map();
  const drawingRelsPart = drawing.replace("drawings/", "drawings/_rels/") + ".rels";
  const media = new Map();
  if (wb.byName.has(drawingRelsPart)) {
    for (const rel of parseXml(await wb.text(drawingRelsPart)).getElementsByTagNameNS(PKGREL, "Relationship")) {
      media.set(rel.getAttribute("Id"), resolvePart(rel.getAttribute("Target"), "xl/drawings/"));
    }
  }
  const sheet = indexSheet(await wb.sheetDoc(info.part));
  const byRow = new Map();
  for (let row = 2; row <= sheet.maxRow; row++) {
    const sn = wb.value(cellAt(sheet, row, 1));
    const name = wb.value(cellAt(sheet, row, 2));
    if (sn && name) byRow.set(row - 1, { sn: String(sn).trim(), name });
  }
  const doc = parseXml(await wb.text(drawing));
  const XDR = "http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing";
  const found = new Map();
  for (const anchor of doc.getElementsByTagNameNS(XDR, "oneCellAnchor")) {
    const rowEl = anchor.getElementsByTagNameNS(XDR, "row")[0];
    const blip = anchor.getElementsByTagNameNS("http://schemas.openxmlformats.org/drawingml/2006/main", "blip")[0];
    if (!rowEl || !blip) continue;
    const target = media.get(blip.getAttributeNS(REL, "embed"));
    const entry = target && wb.byName.get(target);
    const meta = byRow.get(+rowEl.textContent);
    if (!entry || !meta) continue;
    const bytes = await ZIP.bytesOf(entry);
    const list = found.get(meta.sn) || [];
    list.push({ name: meta.name, mime: target.endsWith(".png") ? "image/png" : "image/jpeg", data: bytesToBase64(bytes) });
    found.set(meta.sn, list);
  }
  return found;
}

async function parseWorkbook(buffer) {
  const wb = await Workbook.open(buffer);
  let found = null;
  for (const sheetInfo of wb.sheets) {
    if (APP_SHEETS.includes(sheetInfo.name)) continue;
    const doc = await wb.sheetDoc(sheetInfo.part);
    const sheet = indexSheet(doc);
    const headerRow = findHeaderRow(wb, sheet);
    if (!headerRow) continue;
    const columns = mapColumns(wb, sheet, headerRow);
    if (!columns.sn || !columns.observation) continue;
    found = { sheetInfo, sheet, headerRow, columns };
    break;
  }
  if (!found) {
    throw new Error("No sheet in this file has a CRS comment table (a header row with 'S/N' and 'Observations / Comments').");
  }

  const layout = {
    sheetName: found.sheetInfo.name,
    part: found.sheetInfo.part,
    headerRow: found.headerRow,
    firstDataRow: found.headerRow + 1,
    lastDataRow: found.headerRow + 1,
    columns: found.columns,
  };
  const info = readInfo(wb, found.sheet, found.headerRow);

  const snCol = colIndex(layout.columns.sn);
  const obsCol = colIndex(layout.columns.observation);
  const comments = [];
  for (let row = layout.firstDataRow; row <= found.sheet.maxRow; row++) {
    const observationCell = wb.value(cellAt(found.sheet, row, obsCol));
    const sn = wb.value(cellAt(found.sheet, row, snCol));
    if (!observationCell && !sn) continue;
    const record = { messages: [], attachments: [] };
    for (const [field, letter] of Object.entries(layout.columns)) {
      record[field] = wb.value(cellAt(found.sheet, row, colIndex(letter)));
    }
    if (!record.sn) record.sn = String(comments.length + 1);
    comments.push(record);
    layout.lastDataRow = row;
  }
  layout.styledToRow = lastStyledRow(found.sheet, layout.lastDataRow, obsCol);

  // Threads: the data sheet is exact; cell text is the fallback.
  const data = await readDataSheet(wb);
  let restored = 0;
  if (data && Array.isArray(data.comments)) {
    const bySn = new Map(data.comments.map(c => [String(c.sn).trim(), c]));
    comments.forEach(comment => {
      const saved = bySn.get(String(comment.sn).trim());
      if (!saved) return;
      Object.assign(comment, {
        observation: saved.observation ?? comment.observation,
        response: saved.response ?? "",
        originalResponse: saved.originalResponse || "",
        trade: saved.trade || comment.discipline || "",
        due: saved.due || "",
        published: saved.published !== false,
        attachments: saved.attachments || [],
        messages: saved.messages || [],
      });
      restored += (saved.messages || []).length;
    });
    data.comments.filter(c => !comments.some(x => String(x.sn).trim() === String(c.sn).trim()))
      .forEach(extra => comments.push(extra));
  } else {
    const register = await readRegisterSheet(wb);
    const photos = await readPhotos(wb);
    comments.forEach(comment => {
      const fromObservation = parseThreadCell(comment.observation, "Reviewer");
      const fromResponse = parseThreadCell(comment.response, "Designer");
      comment.observation = fromObservation.preamble || comment.observation;
      comment.originalResponse = fromResponse.preamble || "";
      const merged = [...fromObservation.messages, ...fromResponse.messages]
        .sort((a, b) => (a.number || 0) - (b.number || 0))
        .map(m => ({ ...m, id: uid() }));
      comment.messages = merged;
      restored += merged.length;
      const row = register.get(String(comment.sn).trim());
      comment.trade = (row && row.trade) || comment.discipline || "";
      comment.due = (row && row.due) || "";
      comment.published = true;
      const pictures = photos.get(String(comment.sn).trim()) || [];
      comment.attachments = pictures.map(p => ({ id: uid(), kind: "photo", ...p }));
    });
  }

  comments.forEach((comment, index) => {
    comment.id = comment.id || uid();
    comment.sn = comment.sn || String(index + 1);
    comment.trade = comment.trade || comment.discipline || "";
    comment.messages = comment.messages || [];
    comment.attachments = comment.attachments || [];
    if (comment.published === undefined) comment.published = true;
    comment.messages.forEach(m => { m.id = m.id || uid(); if (m.published === undefined) m.published = true; });
    if (comment.originalResponse === undefined) comment.originalResponse = comment.response || "";
  });

  // The stored template must be the plain form, so exports never stack up.
  for (const name of APP_SHEETS) await wb.removeSheet(name);
  const template = await wb.flush();

  return { layout, info, comments, restored, settings: (data && data.settings) || null, template };
}

/* -- writing -------------------------------------------------------- */

function setCellValue(doc, cell, value) {
  while (cell.firstChild) cell.removeChild(cell.firstChild);
  cell.removeAttribute("t");
  if (value === "" || value === null || value === undefined) return;
  if (typeof value === "number") {
    const v = doc.createElementNS(MAIN, "v");
    v.textContent = String(value);
    cell.appendChild(v);
    return;
  }
  cell.setAttribute("t", "inlineStr");
  const is = doc.createElementNS(MAIN, "is");
  const t = doc.createElementNS(MAIN, "t");
  t.setAttribute("xml:space", "preserve");
  t.textContent = String(value);
  is.appendChild(t);
  cell.appendChild(is);
}

function ensureRow(sheet, row, templateRow) {
  const existing = sheet.rows.get(row);
  if (existing) return existing;
  const el = templateRow.el.cloneNode(true);
  el.setAttribute("r", String(row));
  const cells = new Map();
  for (const cell of el.getElementsByTagNameNS(MAIN, "c")) {
    const parts = refParts(cell.getAttribute("r"));
    if (!parts) continue;
    cell.setAttribute("r", colLetter(parts.col) + row);
    while (cell.firstChild) cell.removeChild(cell.firstChild);
    cell.removeAttribute("t");
    cells.set(parts.col, cell);
  }
  let before = null;
  for (const child of sheet.sheetData.getElementsByTagNameNS(MAIN, "row")) {
    if (+child.getAttribute("r") > row) { before = child; break; }
  }
  sheet.sheetData.insertBefore(el, before);
  const record = { el, cells };
  sheet.rows.set(row, record);
  if (row > sheet.maxRow) sheet.maxRow = row;
  return record;
}

function ensureCell(sheet, row, col, templateRow) {
  const rowRecord = sheet.rows.get(row);
  const existing = rowRecord?.cells.get(col);
  if (existing) return existing;
  const source = templateRow.cells.get(col);
  const cell = source ? source.cloneNode(false) : sheet.doc.createElementNS(MAIN, "c");
  cell.setAttribute("r", colLetter(col) + row);
  let before = null;
  for (const child of rowRecord.el.getElementsByTagNameNS(MAIN, "c")) {
    const parts = refParts(child.getAttribute("r"));
    if (parts && parts.col > col) { before = child; break; }
  }
  rowRecord.el.insertBefore(cell, before);
  rowRecord.cells.set(col, cell);
  return cell;
}

/* Column widths are in characters; used to guess how tall a wrapped row
   has to be so a whole thread is visible without opening the cell. */
function columnWidths(doc) {
  const widths = new Map();
  for (const col of doc.getElementsByTagNameNS(MAIN, "col")) {
    const min = +col.getAttribute("min"), max = +col.getAttribute("max");
    const width = parseFloat(col.getAttribute("width") || "10");
    for (let c = min; c <= max && c <= min + 60; c++) widths.set(c, width);
  }
  return widths;
}

function textHeight(text, width) {
  const perLine = Math.max(8, Math.floor(width - 2));
  const lines = String(text).split("\n")
    .reduce((total, line) => total + Math.max(1, Math.ceil(line.length / perLine)), 0);
  return lines * 11.5 + 6;
}

function patchTable(sheet, layout, comments, styles) {
  const templateRow = sheet.rows.get(layout.lastDataRow) || sheet.rows.get(layout.firstDataRow);
  const styledTo = Math.max(layout.styledToRow || 0, layout.lastDataRow);
  const widths = columnWidths(sheet.doc);
  const obsCol = colIndex(layout.columns.observation);
  const responseCol = layout.columns.response ? colIndex(layout.columns.response) : null;
  let row = layout.firstDataRow;

  comments.forEach((comment, index) => {
    if (!sheet.rows.has(row)) ensureRow(sheet, row, templateRow);
    const cells = threadCells(comment);
    const values = { ...comment, observation: cells.observation, response: cells.response };
    if (layout.columns.discipline) values.discipline = comment.trade || comment.discipline || "";

    for (const [field, letter] of Object.entries(layout.columns)) {
      const col = colIndex(letter);
      const cell = ensureCell(sheet, row, col, templateRow);
      let value = values[field] ?? "";
      if (field === "sn") {
        const asNumber = parseInt(String(value).trim(), 10);
        value = Number.isFinite(asNumber) ? asNumber : (String(value).trim() || index + 1);
      }
      setCellValue(sheet.doc, cell, value);
      if ((col === obsCol || col === responseCol) && String(value).includes("\n")) {
        cell.setAttribute("s", String(styles.wrapped(cell.getAttribute("s"))));
      }
    }

    const needed = Math.max(
      textHeight(cells.observation, widths.get(obsCol) || 55),
      responseCol ? textHeight(cells.response, widths.get(responseCol) || 35) : 0,
      46.5);
    const rowEl = sheet.rows.get(row).el;
    rowEl.setAttribute("ht", String(Math.min(Math.round(needed * 10) / 10, 400)));
    rowEl.setAttribute("customHeight", "1");
    row++;
  });

  for (let stale = row; stale <= styledTo; stale++) {
    for (const letter of Object.values(layout.columns)) {
      const cell = cellAt(sheet, stale, colIndex(letter));
      if (cell) setCellValue(sheet.doc, cell, "");
    }
  }

  const dimension = sheet.doc.getElementsByTagNameNS(MAIN, "dimension")[0];
  if (dimension) {
    const ref = dimension.getAttribute("ref") || "";
    const [from, to] = ref.split(":");
    const end = refParts(to || "");
    const lastRow = Math.max(row - 1, styledTo);
    if (end && end.row < lastRow) dimension.setAttribute("ref", `${from}:${colLetter(end.col)}${lastRow}`);
  }
}

/* -- extra sheets --------------------------------------------------- */

function simpleSheetXml(rows, widths, options = {}) {
  const cols = widths.map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("");
  const body = rows.map((values, rowIndex) => {
    const cells = values.map((value, col) => {
      const text = value === null || value === undefined ? "" : String(value);
      if (!text) return "";
      return `<c r="${colLetter(col + 1)}${rowIndex + 1}" t="inlineStr">` +
        `<is><t xml:space="preserve">${xmlEscape(text)}</t></is></c>`;
    }).join("");
    const height = options.heights && options.heights[rowIndex]
      ? ` ht="${options.heights[rowIndex]}" customHeight="1"` : "";
    return `<row r="${rowIndex + 1}"${height}>${cells}</row>`;
  }).join("");
  return XML_HEAD +
    `<worksheet xmlns="${MAIN}" xmlns:r="${REL}"><cols>${cols}</cols>` +
    `<sheetData>${body}</sheetData>` +
    (options.drawingRelId ? `<drawing r:id="${options.drawingRelId}"/>` : "") +
    "</worksheet>";
}

function registerRows(review) {
  const rows = [["S/N", "Trade", "Assigned to", "Email", "Due date", "Status", "Replies", "Last update", "Attachments"]];
  review.comments.filter(c => c.published !== false).forEach(comment => {
    const trade = findTrade(review, comment.trade);
    const messages = (comment.messages || []).filter(m => m.published !== false);
    rows.push([
      comment.sn,
      comment.trade || "",
      trade ? trade.contactName : "",
      trade ? trade.email : "",
      comment.due || "",
      isClosed(comment) ? "Closed" : (isLate(comment) ? "Open (late)" : "Open"),
      messages.length || "",
      messages.length ? messages[messages.length - 1].at : "",
      (comment.attachments || []).map(a => a.name).join(", "),
    ]);
  });
  return rows;
}

const DRAWING_NS = "http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing";
const ART_NS = "http://schemas.openxmlformats.org/drawingml/2006/main";

function drawingXml(pictures) {
  const anchors = pictures.map((picture, index) => `
    <xdr:oneCellAnchor>
      <xdr:from><xdr:col>5</xdr:col><xdr:colOff>19050</xdr:colOff>
        <xdr:row>${picture.row}</xdr:row><xdr:rowOff>19050</xdr:rowOff></xdr:from>
      <xdr:ext cx="${picture.cx}" cy="${picture.cy}"/>
      <xdr:pic>
        <xdr:nvPicPr><xdr:cNvPr id="${index + 2}" name="Picture ${index + 1}"/><xdr:cNvPicPr/></xdr:nvPicPr>
        <xdr:blipFill><a:blip xmlns:r="${REL}" r:embed="rIdImg${index + 1}"/>
          <a:stretch><a:fillRect/></a:stretch></xdr:blipFill>
        <xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${picture.cx}" cy="${picture.cy}"/></a:xfrm>
          <a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>
      </xdr:pic>
      <xdr:clientData/>
    </xdr:oneCellAnchor>`).join("");
  return XML_HEAD + `<xdr:wsDr xmlns:xdr="${DRAWING_NS}" xmlns:a="${ART_NS}">${anchors}</xdr:wsDr>`;
}

async function addAttachmentSheet(wb, review) {
  const items = [];
  review.comments.filter(c => c.published !== false).forEach(comment => {
    (comment.attachments || []).forEach(a => items.push({ comment, attachment: a, from: comment.reviewer || "" }));
    (comment.messages || []).filter(m => m.published !== false).forEach(message => {
      (message.attachments || []).forEach(a => items.push({ comment, attachment: a, from: message.author, at: message.at }));
    });
  });
  if (!items.length) return false;

  const rows = [["S/N", "File", "Type", "Added by", "Date", "Photo"]];
  const heights = { 0: 20 };
  const pictures = [];
  let imageIndex = 0;

  for (const item of items) {
    const { attachment } = item;
    const rowNumber = rows.length; // zero-based row for the drawing anchor
    rows.push([
      item.comment.sn,
      attachment.name,
      attachment.kind === "photo" ? "Photo" : "File (not shown in Excel)",
      item.from || "",
      item.at || "",
      attachment.kind === "photo" ? "" : "—",
    ]);
    if (attachment.kind !== "photo" || !attachment.data) continue;
    imageIndex++;
    const scale = Math.min(1, 420 / Math.max(attachment.w || 420, 1));
    const width = Math.round((attachment.w || 420) * scale);
    const height = Math.round((attachment.h || 300) * scale);
    const extension = attachment.mime === "image/png" ? "png" : "jpeg";
    const part = `xl/media/crs_photo${imageIndex}.${extension}`;
    wb.ensureDefault(extension, attachment.mime || "image/jpeg");
    await wb.addPart(part, base64ToBytes(attachment.data));
    pictures.push({ row: rowNumber, cx: width * EMU, cy: height * EMU, part, index: imageIndex });
    heights[rowNumber] = Math.max(20, Math.round(height * 0.78));
  }

  let drawingRelId = null;
  let rels = "";
  if (pictures.length) {
    let drawingIndex = 1;
    while (wb.byName.has(`xl/drawings/drawing${drawingIndex}.xml`)) drawingIndex++;
    const drawingPart = `xl/drawings/drawing${drawingIndex}.xml`;
    await wb.addPart(drawingPart, encode(drawingXml(pictures)),
      "application/vnd.openxmlformats-officedocument.drawing+xml");
    const imageRels = pictures.map((picture, index) =>
      `<Relationship Id="rIdImg${index + 1}" Type="${REL}/image" Target="../media/${picture.part.split("/").pop()}"/>`).join("");
    await wb.addPart(`xl/drawings/_rels/drawing${drawingIndex}.xml.rels`,
      encode(XML_HEAD + `<Relationships xmlns="${PKGREL}">${imageRels}</Relationships>`));
    drawingRelId = "rIdDraw";
    rels = XML_HEAD + `<Relationships xmlns="${PKGREL}">` +
      `<Relationship Id="${drawingRelId}" Type="${REL}/drawing" Target="../drawings/drawing${drawingIndex}.xml"/>` +
      `</Relationships>`;
  }

  await wb.addSheet(ATTACHMENT_SHEET,
    simpleSheetXml(rows, [8, 38, 26, 20, 18, 62], { heights, drawingRelId }),
    { rels: rels || null });
  return true;
}

async function addDataSheet(wb, review) {
  const payload = JSON.stringify({
    version: 2,
    settings: review.settings,
    comments: review.comments,
  });
  const base64 = bytesToBase64(encode(payload));
  const rows = [];
  for (let i = 0; i < base64.length; i += 30000) rows.push([base64.slice(i, i + 30000)]);
  await wb.addSheet(DATA_SHEET, simpleSheetXml(rows.length ? rows : [[""]], [20]), { veryHidden: true });
}

/**
 * kind "working": the form with the threads in its cells, plus the register,
 * the attachments and a hidden data sheet, so the file reopens here exactly.
 * kind "clean": the form only (with photos, if any) for formal issue.
 * Unpublished drafts are left out of both.
 */
async function buildExport(templateBuffer, review, kind) {
  const wb = await Workbook.open(templateBuffer);
  const visible = {
    ...review,
    comments: review.comments.filter(c => c.published !== false),
  };

  const doc = await wb.sheetDoc(review.layout.part);
  const sheet = indexSheet(doc);
  const stylesDoc = parseXml(await wb.text("xl/styles.xml"));
  const styles = new Styles(stylesDoc);
  patchTable(sheet, review.layout, visible.comments, styles);
  await ZIP.replace(wb.byName.get(review.layout.part), encode(serialize(doc)));
  if (styles.changed) await ZIP.replace(wb.byName.get("xl/styles.xml"), encode(serialize(stylesDoc)));

  await addAttachmentSheet(wb, visible);
  if (kind === "working") {
    await wb.addSheet(REGISTER_SHEET, simpleSheetXml(registerRows(visible), [8, 20, 22, 30, 14, 14, 10, 18, 40]));
    await addDataSheet(wb, review);
  }
  return wb.flush();
}

/* ------------------------------------------------------------------ *
 * Accounts, projects and what each person is shown.
 *
 * Everything lives in this browser. Signing in decides what the page
 * shows and what it lets you do; it is not a server login, and the
 * section "What a sign-in here can and cannot do" on the sign-in screen
 * says so plainly. The part that really holds is the per-trade file: an
 * engineer can be sent a workbook containing only their own trade's
 * comments, so what they cannot see is what they were never given.
 * ------------------------------------------------------------------ */
const STORE_KEY = "crs-review-v3";
const LEGACY_KEY = "crs-review-v2";
const ROLES = ["Reviewer PM", "Reviewer", "Designer PM", "Designer"];
const REVIEWER_ROLES = ["Reviewer PM", "Reviewer"];

const DEFAULT_SETTINGS = () => ({ mode: "live", dueDays: 14, trades: [] });

const store = { users: [], projects: [], session: null };
const ui = {
  view: "signin", authTab: "signin", projectId: null, sheetId: null,
  commentIndex: null, filter: "all", query: "",
};

const uid = () => "i" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

const bytesToBase64 = bytes => {
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  return btoa(binary);
};
const base64ToBytes = text => {
  const binary = atob(text);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
};

const today = () => new Date().toISOString().slice(0, 10);
const now = () => {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const addDays = days => {
  const d = new Date();
  d.setDate(d.getDate() + (+days || 0));
  return d.toISOString().slice(0, 10);
};

const esc = text => String(text ?? "").replace(/[&<>"']/g, ch =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));

const isClosed = comment => String(comment.signoff || "").trim().toLowerCase() === "closed";
const isLate = comment => !isClosed(comment) && !!comment.due && comment.due < today();
const isDraft = item => item.published === false;
const findTrade = (context, name) =>
  (context.settings?.trades || []).find(t => norm(t.name) === norm(name)) || null;

/* -- storage -------------------------------------------------------- */

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      store.users = saved.users || [];
      store.projects = (saved.projects || []).map(p => ({ ...p, settings: { ...DEFAULT_SETTINGS(), ...(p.settings || {}) } }));
      store.session = saved.session || null;
    }
  } catch (err) {
    flash("Could not read saved work from this browser: " + err.message, "warn");
  }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    return true;
  } catch (err) {
    flash("This browser would not save your work, most likely because the photos fill its storage. " +
      "Save a working copy to keep it in a file.", "warn");
    return false;
  }
}

/** Sheets from the version before accounts existed, moved into a project. */
function adoptLegacySheets(owner) {
  let legacy;
  try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "null"); } catch { return; }
  if (!legacy || !(legacy.reviews || []).length) return;
  const project = newProject("Imported sheets", owner.email);
  legacy.reviews.forEach(review => {
    project.sheets.push({
      id: uid(), fileName: review.fileName, title: review.title, layout: review.layout,
      info: review.info, comments: review.comments, workbook: review.workbook, savedAt: review.savedAt,
    });
    if (review.settings) project.settings = { ...project.settings, ...review.settings };
  });
  store.projects.push(project);
  localStorage.removeItem(LEGACY_KEY);
  flash(`Moved ${legacy.reviews.length} sheet${legacy.reviews.length > 1 ? "s" : ""} from before into the project “Imported sheets”.`);
}

/* -- accounts ------------------------------------------------------- */

async function hashPassword(password, salt) {
  if (!crypto?.subtle) {
    // Only reachable on an insecure origin; the sign-in screen says so.
    let h = 2166136261;
    for (const ch of salt + password) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return "weak:" + (h >>> 0).toString(36);
  }
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations: 150000, hash: "SHA-256" }, key, 256);
  return bytesToBase64(new Uint8Array(bits));
}

const randomPassword = () => "Crs-" + Math.random().toString(36).slice(2, 7).toUpperCase();
const findUser = email => store.users.find(u => norm(u.email) === norm(email)) || null;
const me = () => (store.session ? findUser(store.session) : null);

async function createUser({ name, email, organization, role, password }) {
  if (findUser(email)) throw new Error("There is already an account for " + email + " in this browser.");
  const salt = uid();
  const user = {
    email: email.trim(), name: name.trim() || email.trim(), organization: (organization || "").trim(),
    role: ROLES.includes(role) ? role : "Reviewer",
    salt, hash: await hashPassword(password, salt),
    mustChange: false, createdAt: now(),
  };
  store.users.push(user);
  return user;
}

/* -- projects and membership ---------------------------------------- */

const newProject = (name, ownerEmail) => ({
  id: uid(), name, createdBy: ownerEmail, createdAt: now(),
  settings: DEFAULT_SETTINGS(), members: [], sheets: [],
});

const project = () => store.projects.find(p => p.id === ui.projectId) || null;
const sheet = () => (project()?.sheets || []).find(s => s.id === ui.sheetId) || null;
const membership = (p, email = store.session) =>
  (p?.members || []).find(m => norm(m.email) === norm(email)) || null;
const isAdmin = p => !!p && norm(p.createdBy) === norm(store.session);
const roleIn = p => membership(p)?.role || me()?.role || "Reviewer";
const seesAll = p => isAdmin(p) || roleIn(p).endsWith("PM");
const myTrade = p => membership(p)?.trade || "";
const myProjects = () => store.projects.filter(p => isAdmin(p) || membership(p));

/** What this person is allowed to see on a sheet. */
function visibleComments(p, s) {
  const all = (s.comments || []).map((c, i) => ({ c, i }));
  if (seesAll(p)) return all;
  const trade = norm(myTrade(p));
  const email = norm(store.session);
  return all.filter(({ c }) =>
    (trade && norm(c.trade) === trade) ||
    norm(c.authorEmail) === email ||
    (c.messages || []).some(m => norm(m.authorEmail) === email));
}

const canReply = p => !!membership(p) || isAdmin(p);
const canRaise = p => REVIEWER_ROLES.includes(roleIn(p)) || isAdmin(p);
const canAssign = p => seesAll(p);
const canSetTrades = p => isAdmin(p) || roleIn(p) === "Reviewer PM";
const canManageMembers = p => isAdmin(p) || roleIn(p).endsWith("PM");

/* -- small helpers -------------------------------------------------- */

function touch() {
  const s = sheet();
  if (s) s.savedAt = now();
  save();
}

function flash(message, kind = "ok") {
  const box = document.getElementById("flashes");
  const div = document.createElement("div");
  div.className = "flash " + kind;
  div.textContent = message;
  box.appendChild(div);
  setTimeout(() => div.remove(), kind === "error" || kind === "warn" ? 16000 : 7000);
}

function download(bytes, name) {
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function stats(comments) {
  const open = comments.filter(c => !isClosed(c));
  return {
    total: comments.length,
    open: open.length,
    closed: comments.length - open.length,
    late: comments.filter(isLate).length,
    soon: comments.filter(c => !isClosed(c) && c.due && c.due >= today() && c.due <= addDays(7)).length,
    noReply: open.filter(c => !(c.messages || []).filter(m => !isDraft(m)).length).length,
    drafts: comments.reduce((n, c) => n + (isDraft(c) ? 1 : 0) +
      (c.messages || []).filter(isDraft).length, 0),
  };
}

const tilesHtml = counts => [
  ["Open", counts.open, "open"],
  ["Closed", counts.closed, "closed"],
  ["Late", counts.late, counts.late ? "late" : "flat"],
  ["Due within 7 days", counts.soon, "flat"],
  ["Awaiting a first reply", counts.noReply, "flat"],
  ["Your drafts", counts.drafts, counts.drafts ? "draft" : "flat"],
].map(([label, value, tone]) => `<div class="tile ${tone}">
    <div class="tile-value">${value}</div><div class="tile-label">${label}</div></div>`).join("");

/* ------------------------------------------------------------------ *
 * Attachments
 * ------------------------------------------------------------------ */
const MAX_FILE = 8 * 1024 * 1024;

async function shrinkPhoto(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1400 / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.82));
  return { data: bytesToBase64(new Uint8Array(await blob.arrayBuffer())), mime: "image/jpeg", w, h };
}

async function readAttachment(file) {
  if (/^image\//.test(file.type)) {
    return { id: uid(), kind: "photo", name: file.name, ...(await shrinkPhoto(file)) };
  }
  if (file.size > MAX_FILE) {
    flash(`${file.name} is too big to travel inside the sheet, so only its name is recorded. ` +
      "Send the file alongside the workbook.", "warn");
    return { id: uid(), kind: "file", name: file.name, mime: file.type || "application/octet-stream", data: "" };
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  return { id: uid(), kind: "file", name: file.name, mime: file.type || "application/octet-stream", data: bytesToBase64(bytes) };
}

function attachmentHtml(attachment, owner) {
  if (attachment.kind === "photo" && attachment.data) {
    return `<figure class="thumb">
      <img src="data:${esc(attachment.mime)};base64,${attachment.data}" alt="${esc(attachment.name)}">
      <figcaption>${esc(attachment.name)}
        <button class="link danger" data-drop-attachment="${esc(owner)}:${esc(attachment.id)}">remove</button>
      </figcaption></figure>`;
  }
  const label = attachment.data
    ? `<a href="data:${esc(attachment.mime)};base64,${attachment.data}" download="${esc(attachment.name)}">${esc(attachment.name)}</a>`
    : `${esc(attachment.name)} <span class="muted">(name only)</span>`;
  return `<span class="file-chip">📎 ${label}
    <button class="link danger" data-drop-attachment="${esc(owner)}:${esc(attachment.id)}">remove</button></span>`;
}

/* ------------------------------------------------------------------ *
 * Views
 * ------------------------------------------------------------------ */
const view = () => document.getElementById("view");

function render() {
  const user = me();
  const bar = document.getElementById("user-bar");
  if (user) {
    const p = project();
    bar.innerHTML = `<span class="who-name">${esc(user.name)}</span>
      <span class="who-role">${esc(p ? roleIn(p) : user.role)}${p && myTrade(p) ? " · " + esc(myTrade(p)) : ""}</span>
      <button class="link light" data-go="account">Account</button>
      <button class="link light" id="sign-out">Sign out</button>`;
  } else {
    bar.innerHTML = "";
  }

  if (!user) { ui.view = "signin"; renderSignIn(); return; }
  if (user.mustChange) { renderPassword(true); return; }

  switch (ui.view) {
    case "account": return renderAccount();
    case "settings": return project() ? renderSettings() : renderOverview();
    case "comment": return sheet() ? renderComment() : renderProject();
    case "sheet": return sheet() ? renderSheet() : renderProject();
    case "project": return project() ? renderProject() : renderOverview();
    default: return renderOverview();
  }
}

function renderSignIn() {
  const tab = ui.authTab;
  view().innerHTML = `
    <section class="card auth">
      <h1>CRS Review</h1>
      <nav class="auth-tabs">
        <button class="tab ${tab === "signin" ? "on" : ""}" data-auth="signin">Sign in</button>
        <button class="tab ${tab === "create" ? "on" : ""}" data-auth="create">Create an account</button>
      </nav>
      ${tab === "signin" ? `
        <div class="grid-form">
          <label class="wide">Email <input id="si-email" type="email" autocomplete="username"></label>
          <label class="wide">Password <input id="si-password" type="password" autocomplete="current-password"></label>
          <button class="primary" id="do-signin">Sign in</button>
        </div>
        ${store.users.length ? "" : '<p class="hint">No accounts in this browser yet. Create one to start.</p>'}`
      : `
        <div class="grid-form">
          <label>Name <input id="cu-name"></label>
          <label>Email <input id="cu-email" type="email"></label>
          <label>Organization <input id="cu-org"></label>
          <label>You are a <select id="cu-role">${ROLES.map(r => `<option>${r}</option>`).join("")}</select></label>
          <label class="wide">Password <input id="cu-password" type="password" autocomplete="new-password"></label>
          <button class="primary" id="do-create">Create account</button>
        </div>`}
    </section>

    <section class="card">
      <h2>What a sign-in here can and cannot do</h2>
      <p class="hint">This page is a file on your computer, so the sign-in decides what the page shows you and
      what it lets you do, and your password is stored only as a scrambled fingerprint that cannot be read back.
      What it cannot do is keep a determined person out of the data in their own copy of the file: anyone who can
      open the browser's developer tools can look at what that copy holds. The protection that does hold is not
      giving them the data in the first place, which is why a project can send each engineer a workbook carrying
      only their own trade's comments. If you need a real login that nobody can walk around, the same app needs
      to live on a server.</p>
    </section>`;
}
