<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM Project Journey</title>
<style>
/* Layout: top bar; Map = dashboard strip + (winding station path | side panel); Station = one card at a time or list.
   Offline by design: system fonts, inline SVG icons, no network requests. */
:root{
  /* The CDT SDK's Dar palette (app/static/cdt/cdt.css), so the journey matches the rest of Project Control. */
  --bg:#F2F0E8; --surface:#FFFFFF; --raised:#FBFAF6; --sunk:#E7E4DA; --fg:#1E1D1A; --muted:#67645C; --faint:#98948A; --line:#DED9CC; --line2:#EAE6DC;
  --accent:#147165; --accent-2:#1FAE9B; --accent-soft:#E3EEED; --accent-wash:#F3F8F7; --accent-strong:#0C463E; --accent-fg:#ffffff;
  --gold:#B07A0A; --gold-soft:#F7EED9; --ok:#207410; --ok-soft:#E9F1E7; --on-ok:#ffffff; --na:#98948A;
  --lock:#8D5918; --lock-soft:#F4EEE8; --q:#1C63BC; --q-soft:#E4ECF7; --bad:#C42020; --bad-soft:#FDF3F3;
  --shadow:0 1px 2px rgba(30,29,26,.06),0 4px 14px rgba(30,29,26,.05);
  --pop:0 12px 32px rgba(30,29,26,.18),0 2px 6px rgba(30,29,26,.08);
  --display:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --body:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1B19; --surface:#232321; --raised:#2A2A27; --sunk:#323230; --fg:#F2EFE9; --muted:#9F9B92; --faint:#6E6A62; --line:#353532; --line2:#2E2E2B;
  --accent:#32DAC4; --accent-2:#6EE5D5; --accent-soft:#243531; --accent-wash:#1D2825; --accent-strong:#5DE2D0; --accent-fg:#1B1B19;
  --gold:#F0B94A; --gold-soft:#3A3020; --ok:#6BDE4A; --ok-soft:#2C3926; --on-ok:#14270C; --na:#6E6A62;
  --lock:#FB9B24; --lock-soft:#3D3121; --q:#4B9FF3; --q-soft:#28323A; --bad:#F87171; --bad-soft:#332321;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1B19; --surface:#232321; --raised:#2A2A27; --sunk:#323230; --fg:#F2EFE9; --muted:#9F9B92; --faint:#6E6A62; --line:#353532; --line2:#2E2E2B;
  --accent:#32DAC4; --accent-2:#6EE5D5; --accent-soft:#243531; --accent-wash:#1D2825; --accent-strong:#5DE2D0; --accent-fg:#1B1B19;
  --gold:#F0B94A; --gold-soft:#3A3020; --ok:#6BDE4A; --ok-soft:#2C3926; --on-ok:#14270C; --na:#6E6A62;
  --lock:#FB9B24; --lock-soft:#3D3121; --q:#4B9FF3; --q-soft:#28323A; --bad:#F87171; --bad-soft:#332321;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4); color-scheme:dark}
/* The CDT brand (chosen in the account menu): blue accent, so questions take the teal. */
:root[data-cdt-brand="cdt"]{--accent:#1C63BC; --accent-2:#3D86E2; --accent-soft:#E4ECF7; --accent-wash:#F4F7FC; --accent-strong:#154C90; --q:#147165; --q-soft:#E3EEED}
@media (prefers-color-scheme: dark){:root[data-cdt-brand="cdt"]:not([data-theme="light"]){--accent:#4B9FF3; --accent-2:#84BEF7; --accent-soft:#28323A; --accent-wash:#1F262A; --accent-strong:#7BB8F6; --q:#32DAC4; --q-soft:#243531}}
:root[data-cdt-brand="cdt"][data-theme="dark"]{--accent:#4B9FF3; --accent-2:#84BEF7; --accent-soft:#28323A; --accent-wash:#1F262A; --accent-strong:#7BB8F6; --q:#32DAC4; --q-soft:#243531}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.savedtag{font-size:12px;color:var(--faint);white-space:nowrap}
html:not(.srv) .savedtag{display:none}
svg.i{width:1em;height:1em;vertical-align:-.14em;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.brand{font:600 15px var(--display);display:flex;gap:9px;align-items:center;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-fg);display:grid;place-items:center}
.brand .mk svg{width:16px;height:16px}
.crumb{display:flex;gap:8px;align-items:center;min-width:0;color:var(--muted);font-size:13.5px;margin-right:auto}
.crumb .sep{color:var(--faint)}
.crumb b{color:var(--fg);font-weight:600;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.crumb span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bagbtn{display:flex;gap:6px;align-items:center;border:1px solid var(--q);color:var(--q);background:var(--q-soft);border-radius:999px;padding:4px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:240px;z-index:30}
.menu .pop button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.menu .pop button:hover{background:var(--sunk)}
.menu .pop hr{border:0;border-top:1px solid var(--line2);margin:4px 0}

.wrap{max-width:1180px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 1.65rem/1.2 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 1.15rem/1.25 var(--display);margin:0}
h3{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.eyebrow{font:600 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.big{padding:11px 18px;font-size:15px;border-radius:10px}
.btn.sm{padding:4px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600}
.lnk:hover{text-decoration:underline;text-underline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* home */
.homehead{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin:0 0 22px;overflow:hidden}
.how > div{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border-right:1px solid var(--line2)}
.how > div:last-child{border-right:0}
.how .b{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.how .b.q{background:var(--q-soft);color:var(--q)} .how .b.g{background:var(--gold-soft);color:var(--gold)}
.how b{display:block;font-size:14px}
.how span{font-size:13px;color:var(--muted)}
.plist{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.prow .ringS{width:44px;height:44px}
.prow .num{font:600 12.5px var(--mono);color:var(--accent)}
.prow .ttl{font-weight:600;overflow-wrap:anywhere}
.prow .meta{font-size:12.5px;color:var(--muted)}
.form{padding:20px;display:grid;gap:14px;max-width:560px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-size:15px;color:var(--fg);font-weight:400}
.err{color:var(--bad);font-size:13.5px}

/* dashboard */
.dash{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:16px 18px;margin:16px 0 18px}
.ring{position:relative;width:92px;height:92px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--sunk);stroke-width:9}
.ring .fgc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font:700 22px var(--display)} .ring .lbl span{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kpi{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--raised);display:grid;gap:2px;text-align:left}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--accent)}
.kpi .v{font:700 20px var(--display);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi.g .v{color:var(--gold)} .kpi.q .v{color:var(--q)} .kpi.l .v{color:var(--lock)} .kpi.b .v{color:var(--bad)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:920px){.mapgrid{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr)}.side{position:sticky;top:76px}}
.mapbox{padding:14px 10px 10px}
.side{display:grid;gap:14px}
.side .panel{padding:14px 16px}
.side h3{margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ulist{display:grid}
.ulist button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line2);padding:9px 2px;cursor:pointer}
.ulist button:first-child{border-top:0}
.ulist button:hover .t{color:var(--accent)}
.ulist .t{font-size:14px;font-weight:600;line-height:1.3}
.ulist .s{font-size:12px;color:var(--muted)}
.ulist .chev{color:var(--faint)}
.empty{font-size:13.5px;color:var(--muted);padding:4px 0}

/* map */
.map{position:relative}
.map svg.path{position:absolute;inset:0;overflow:visible}
.map .track{fill:none;stroke:var(--sunk);stroke-width:12;stroke-linecap:round}
.map .trackd{fill:none;stroke:var(--gold);stroke-width:12;stroke-linecap:round;opacity:.5}
.node{position:absolute;width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:transform .15s;box-shadow:var(--shadow)}
.node:hover{transform:scale(1.06)}
.node .in{width:45px;height:45px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 17px var(--display);color:var(--fg)}
.node.cleared{background:var(--gold)} .node.cleared .in{background:var(--gold-soft);color:var(--gold)} .node.cleared .in svg{width:22px;height:22px}
.node.cur{box-shadow:0 0 0 6px var(--accent-soft),var(--shadow)}
.node.cur::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.node .qdot{position:absolute;top:-5px;right:-6px;height:20px;border-radius:10px;background:var(--q);color:#fff;font:700 11px var(--mono);display:flex;gap:2px;align-items:center;padding:0 6px}
.node .ldot{position:absolute;bottom:-4px;right:-4px;width:21px;height:21px;border-radius:50%;background:var(--lock-soft);color:var(--lock);border:1px solid var(--lock);display:grid;place-items:center}
.node .ldot svg{width:11px;height:11px}
.nlabel{position:absolute;display:grid;gap:1px;cursor:pointer;background:none;border:0;padding:4px 7px;text-align:left;border-radius:8px}
.nlabel:hover{background:var(--sunk)}
.nlabel.l{text-align:right}
.nlabel .t{font:600 14.5px/1.2 var(--display)}
.nlabel .s{font-size:12px;color:var(--muted)}
.here{position:absolute;font:700 10px var(--body);letter-spacing:.08em;background:var(--accent);color:var(--accent-fg);padding:2px 8px;border-radius:9px;white-space:nowrap}

/* station */
.sthead{display:grid;grid-template-columns:auto 1fr auto;gap:10px 16px;align-items:center}
.sthead .d{font-size:13.5px;color:var(--muted);margin-top:2px;max-width:70ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sprog{display:flex;gap:12px;align-items:center;margin:16px 0 20px}
.sprog .bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.sprog .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.sprog .bar i.n{background:var(--na)}
.sprog .num{font:600 12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stage{max-width:660px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:var(--shadow);display:grid;gap:14px;animation:cardIn .25s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.q{border-top:4px solid var(--q)} .card.t{border-top:4px solid var(--accent)}
.card .top2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:5px;align-items:center;font:600 11px var(--body);letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.pill.q{background:var(--q-soft);color:var(--q)} .pill.f{background:var(--gold-soft);color:var(--gold)} .pill.t{background:var(--accent-soft);color:var(--accent)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.card .title{font:600 1.32rem/1.3 var(--display);margin:0;text-wrap:balance}
.card .meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;gap:5px;align-items:center;font:500 12px var(--mono);padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.ref{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.answers{display:grid;gap:8px}
.answers button{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--raised);border-radius:10px;padding:11px 13px;text-align:left;cursor:pointer;font-weight:600;font-size:15px}
.answers button .k{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font:600 11.5px var(--mono);color:var(--muted);background:var(--surface)}
.answers button:hover{border-color:var(--q);background:var(--q-soft)}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.acts .done{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.acts .done:hover{filter:brightness(1.07)}
.subacts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.keys{font-size:12px;color:var(--faint)}
.keys kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raised);color:var(--muted)}
@media (hover:none){.keys{display:none}}
.more{border-top:1px solid var(--line2);padding-top:12px;display:grid;gap:10px;font-size:14px}
.more .why{color:var(--muted);font-size:13px}
.more .why b{color:var(--fg);font-weight:600}
.tip{border-left:3px solid var(--q);background:var(--q-soft);padding:8px 11px;border-radius:0 8px 8px 0;font-size:13.5px}
.tip b{font:600 11px var(--body);color:var(--q);display:block;letter-spacing:.06em;text-transform:uppercase}
.note{width:100%;min-height:64px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-size:14px;resize:vertical}
.more input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--raised)}
.win{text-align:center;justify-items:center;padding:32px 22px}
.medal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.medal svg{width:52px;height:52px}
.medal.dim{background:var(--sunk);color:var(--faint);animation:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.left{display:grid;gap:8px;width:100%;max-width:460px;text-align:left}
.leftrow{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.leftrow.q{border-color:var(--q)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;max-width:660px;margin-inline:auto}

/* list mode */
.lsec{margin-top:18px}
.lsec h3{margin:0 0 6px}
.li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:11px 4px;border-bottom:1px solid var(--line2)}
.li .ck{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.li .lkic{color:var(--lock);padding-top:2px}
.li .t{font-weight:600;cursor:pointer}
.li.done .t{text-decoration:line-through;color:var(--na)}
.li.na{opacity:.6}
.li.lk .t{color:var(--muted)}
.li .sm{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.li .more{grid-column:2/4}
.lq{background:var(--q-soft);border:1px solid var(--q);border-radius:12px;padding:12px;display:grid;gap:8px;margin-bottom:8px}
.lq.ans{background:var(--surface);border-color:var(--line)}
.lq .answers{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.lq .answers button{padding:8px 10px;font-size:14px;grid-template-columns:1fr}
.lq .answers button .k{display:none}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);width:min(660px,94vw);max-height:88vh;padding:0;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,16,20,.5)}
.dlg{display:grid;grid-template-rows:auto auto 1fr;max-height:88vh}
.dlg .h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px}
.dlg .tabs{display:flex;gap:6px;padding:0 18px 12px;border-bottom:1px solid var(--line)}
.dlg .tabs button{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;font-weight:600}
.dlg .tabs button[aria-pressed="true"]{background:var(--q);border-color:var(--q);color:#fff}
.dlg .body{overflow:auto;padding:14px 18px 20px;display:grid;gap:12px;align-content:start}
.dq{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.dq .st{font:600 11px var(--body);color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.dq .l{font-weight:600}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:9px 10px 9px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92vw;display:flex;gap:14px;align-items:center}

/* view tabs in the top bar: Journey | By frequency */

.vtabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow)}

/* map + the station's cards side by side */
.mapgrid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.mapgrid2 .deckcol{display:grid;gap:14px;order:-1}
@media (min-width:920px){.mapgrid2{grid-template-columns:minmax(330px,.85fr) minmax(0,1.15fr)}.mapgrid2 .deckcol{order:0;position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;padding:2px 4px 8px 2px;scrollbar-width:thin}}
.deck{padding:0;overflow:hidden}
.deck .dh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px 12px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,var(--accent-wash),var(--surface))}
.deck .dn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font:700 15px var(--display)}
.deck .dn.cleared{background:var(--gold);color:#fff}
.deck .dt{min-width:0}
.deck .dt b{display:block;font:600 16px/1.25 var(--display)}
.deck .dt span{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deck .dbar{grid-column:1/4;display:flex;gap:10px;align-items:center}
.deck .dbar .bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}

.qsteps{display:flex;align-items:center;gap:0;margin:0;padding:0;list-style:none}

.qsteps li.at{color:var(--fg)} .qsteps li.at .n{border-color:var(--q);color:var(--q);box-shadow:0 0 0 3px var(--q-soft)}
.qsteps li.done{color:var(--muted)} .qsteps li.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.answers button[aria-pressed="true"]{border-color:var(--q);background:var(--q-soft);color:var(--fg)}
.answers button[aria-pressed="true"] .k{background:var(--q);border-color:var(--q);color:#fff}
.decides{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.confirm{border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:12px;display:grid;gap:8px;animation:cardIn .25s ease-out}

.crow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:9px 10px}

/* card navigation: previous / next and a dot per card in the station */
.cnav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:12px}
.cnav .btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}

.fgroup .gh h2{font-size:1.05rem}
.fgroup .gh span{font-size:12.5px;color:var(--muted)}
.frow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.frow:last-child{border-bottom:0}
.frow .ck{width:18px;height:18px;margin:0;accent-color:var(--ok);cursor:pointer}
.frow .t{font-weight:600;cursor:pointer;line-height:1.3}
.frow .t:hover{color:var(--accent)}
.frow.ticked .t,.frow.done .t{color:var(--muted)}
.frow.na{opacity:.6}
.frow.lk .t{color:var(--muted)}

.frow .right{display:flex;gap:8px;align-items:center}
.hist{display:flex;gap:3px;align-items:center}
.hd{width:14px;height:14px;border-radius:4px;border:0;padding:0;cursor:pointer;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.hd.on{background:var(--ok);box-shadow:none}
.hd.now{outline:2px solid var(--q);outline-offset:1px}
.hlab{font-size:11px;color:var(--faint);white-space:nowrap}
@media (max-width:640px){.dash{padding:12px}.dash .ring{display:none}.dash .kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:7px 8px}.kpi .v{font-size:16px}.kpi .k{font-size:11px;line-height:1.25}
  .deck .dh .btn span{display:none}.deck .dh{padding:12px}.deck .dbody{padding:10px}.deck .card{padding:14px 12px 12px}.cnav .btn{padding:4px 8px}}

#report{display:none}
@media (max-width:640px){h1{font-size:1.35rem}.card{padding:18px 16px 14px}.card .title{font-size:1.15rem}.sthead{grid-template-columns:auto 1fr}.sthead .seg{grid-column:1/3;justify-self:start}.dash{grid-template-columns:1fr;justify-items:center}.kpis{width:100%;grid-template-columns:repeat(2,1fr)}.crumb b,.crumb .t,.crumb .sep{display:none}.how > div{border-right:0;border-bottom:1px solid var(--line2)}}

}

<!-- Inside Project Control: this project's copy and where to save it. Left as the
     placeholder when the page is built to run on its own, which keeps it in the browser. -->
<script id="server" type="application/json">/*SERVER*/</script>

<script>
(function(){
"use strict";
const LIB=JSON.parse(document.getElementById("library").textContent);
const ST=LIB.phases, SI=Object.fromEntries(ST.map((s,i)=>[s.id,i]));
const QS=Object.fromEntries(LIB.questions.map(q=>[q.id,q]));
const CHOICE=LIB.questions.filter(q=>q.opts);
const TEXTQ=LIB.questions.filter(q=>q.type==="text");
const KEY="pm-procedure-checklist.v1";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- icons ---------- */
const P={
 star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor" stroke="none"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 check:'<path d="M5 12.5l4.2 4.2L19 7"/>',
 q:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
 chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>',
 cards:'<rect x="6" y="4" width="13" height="16" rx="2"/><path d="M3 7v11a2 2 0 0 0 2 2"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/>',
 doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 sheet:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',
 save:'<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', upload:'<path d="M12 20V9M7 14l5-5 5 5"/><path d="M5 4h14"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',
 repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
 expand:'<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>'
};
const I=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll("#vtabs [data-view]").forEach(b=>{ b.innerHTML=b.dataset.view==="freq"?`${I("repeat")}<span class="l">By frequency</span>`:`${I("route")}<span class="l">Journey</span>`; });
document.querySelectorAll("#menu [data-m]").forEach(b=>{ const m={report:["doc","Status report (print / PDF)"],csv:["sheet","Export to Excel (CSV)"],export:["save","Back up this project"],answers:["edit","Edit answers"],sources:["book","Procedure sources"],home:["home","All projects"]}[b.dataset.m]; b.innerHTML=I(m[0])+esc(m[1]); });

/* Each question is asked at the first station that has an action depending on it (never before its parent question). */
const QST={};
(function(){
  const walk=(c,i)=>Object.entries(c||{}).forEach(([k,v])=>{ if(k==="any") v.forEach(x=>walk(x,i)); else if(QS[k]) QST[k]=Math.min(QST[k]??99,i); });
  LIB.items.forEach(it=>walk(it.when,SI[it.ph]));
  CHOICE.forEach(q=>{ if(QST[q.id]===undefined) QST[q.id]=0; });
  CHOICE.forEach(q=>{ if(q.show) Object.keys(q.show).forEach(k=>{ if(QST[k]>QST[q.id]) QST[q.id]=QST[k]; }); });
})();

/* ---------- storage ---------- */
let SRV=null; try{ SRV=JSON.parse(document.getElementById("server").textContent); }catch(e){ SRV=null; }
let DB={projects:{},current:null}, storageOK=true;
if(SRV){ const st=SRV.state; DB={projects:{[st.id]:st},current:st.id}; document.documentElement.classList.add("srv"); }
else { try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.projects) DB=d; } }catch(e){ storageOK=false; } }
Object.values(DB.projects).forEach(fix);
/* In Project Control every change goes to the project on the server, as only the
   keys it touched, so two people clearing different cards both keep their work. */
const MAPS=["answers","status","notes","due","skipped","doneAt","visited","ticks"];
const snap=p=>JSON.parse(JSON.stringify(Object.fromEntries(MAPS.map(k=>[k,p[k]||{}]))));
let synced=SRV?snap(cur0()):null, syncT=null, syncing=false, viewOnlyTold=false;
function cur0(){ return DB.projects[DB.current]; }
function diff(p){ const out={}; let any=false; MAPS.forEach(k=>{ const a=synced[k]||{}, b=p[k]||{}; const c={};
  Object.keys(b).forEach(x=>{ if(JSON.stringify(a[x])!==JSON.stringify(b[x])) c[x]=b[x]; });
  Object.keys(a).forEach(x=>{ if(!(x in b)) c[x]=null; });
  if(Object.keys(c).length){ out[k]=c; any=true; } }); return any?out:null; }
function sync(){
  clearTimeout(syncT); if(syncing){ syncT=setTimeout(sync,400); return; }
  const p=cur0(); const patch=diff(p); if(!patch) return;
  if(!SRV.canEdit){ if(!viewOnlyTold){ toast("You can view this project but not change it."); viewOnlyTold=true; } return; }
  const sent=snap(p); syncing=true; setSaved("Saving…");
  fetch(SRV.saveUrl,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({patch})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{ syncing=false; if(!ok||!j.ok){ setSaved("Not saved"); toast(j.error||"Couldn't save. Try again."); return; }

/* What other people changed meanwhile, taken in without losing anything not yet sent. */
function mergeRemote(remote){

    const next={...r}; Object.entries(keep).forEach(([x,v])=>{ if(v===null) delete next[x]; else next[x]=v; });
    if(JSON.stringify(next)!==JSON.stringify(p[k]||{})){ p[k]=next; changed=true; }
    synced[k]=JSON.parse(JSON.stringify(r)); });

}

/* ---------- logic: true / false / null (= waiting for an answer) ---------- */
function val(k,ans){
  const q=QS[k]; if(!q) return ans[k];
  if(q.show){ const s=ev(q.show,ans); if(s===false) return q.opts[0][0]; if(s===null) return undefined; }
  return ans[k];
}
function ev(cond,ans){
  if(!cond) return true; let res=true;
  for(const [k,v] of Object.entries(cond)){
    let r;
    if(k==="any"){ const s=v.map(c=>ev(c,ans)); r=s.includes(true)?true:(s.every(x=>x===false)?false:null); }
    else { const a=val(k,ans); r = a===undefined ? null : (Array.isArray(v)?v.includes(a):a===v); }
    if(r===false) return false; if(r===null) res=null;
  }
  return res;
}
function unknownKeys(cond,ans,out=new Set()){
  Object.entries(cond||{}).forEach(([k,v])=>{ if(k==="any") v.forEach(c=>unknownKeys(c,ans,out)); else if(val(k,ans)===undefined) out.add(k); });
  return [...out];
}
function itemState(p,it){ const e=ev(it.when,p.answers); if(e===false) return "hidden"; if(e===null) return "locked"; return p.status[it.id]||"open"; }
const shown=(p,q)=>!q.show || ev(q.show,p.answers)===true;
const unanswered=(p,q)=>p.answers[q.id]===undefined;
function stationQs(p,i){ return CHOICE.filter(q=>QST[q.id]===i && shown(p,q) && unanswered(p,q)); }
function info(p,i){
  const its=LIB.items.filter(it=>SI[it.ph]===i).map(it=>({it,s:itemState(p,it)})).filter(x=>x.s!=="hidden");
  const c={open:0,done:0,na:0,locked:0}; its.forEach(x=>c[x.s]++);
  const qs=stationQs(p,i), total=its.length;
  return {i,its,qs,...c,total,visible:total>0||qs.length>0,cleared:(total>0||qs.length>0)&&c.open===0&&c.locked===0&&qs.length===0};
}
/* The station on screen asks its own questions, so they are not "waiting". */
const onScreen=i=>(VIEW.name==="station"&&VIEW.arg===i)||(VIEW.name==="map"&&UI.deckSt===i);
function bag(p){ return CHOICE.filter(q=>shown(p,q)&&unanswered(p,q)&&((p.visited[QST[q.id]]&&!onScreen(QST[q.id]))||p.skipped[q.id])); }
function label(q,v){ const o=q.opts.find(x=>x[0]===v); return o?o[1]:v; }
function whyText(cond,ans){
  const parts=[]; const go=c=>Object.entries(c||{}).forEach(([k,v])=>{ if(k==="any"){ v.filter(x=>ev(x,ans)===true).forEach(go); return; } if(k==="aide") return; const q=QS[k]; const a=val(k,ans); if(q&&a!==undefined) parts.push(`${q.short||q.label}: ${label(q,a)}`); });
  go(cond); return parts.join(" · ");
}
const qname=k=>QS[k]?(QS[k].short||QS[k].label):k;
function summary(p){
  const vis=ST.map((s,i)=>info(p,i)).filter(x=>x.visible);
  const rows=LIB.items.map(it=>({it,s:itemState(p,it)})).filter(x=>x.s!=="hidden");
  const n={open:0,done:0,na:0,locked:0}; rows.forEach(r=>n[r.s]++);
  const overdue=rows.filter(r=>r.s==="open"&&dueInfo(p.due[r.it.id])?.over);
  return {vis,rows,n,stars:vis.filter(x=>x.cleared).length,pct:rows.length?Math.round((n.done+n.na)/rows.length*100):0,overdue,bagN:bag(p).length};
}

/* ---------- a station's cards ----------
   The actions keep the procedure's own order. A question is not a step of the
   procedure: it sits just before the first action it decides. Once answered, the
   question asks a second confirmation: that the actions it requires were actually
   carried out. Those actions are cleared inside the question's card (up to
   GROUP_MAX of them; a longer list follows as cards of its own), so answering
   "Yes" never reads as the work being done. */
const GROUP_MAX=6;
function condKeys(c,out=[]){ Object.entries(c||{}).forEach(([k,v])=>{ if(k==="any") v.forEach(x=>condKeys(x,out)); else if(!out.includes(k)) out.push(k); }); return out; }
function stationSeq(p,i){
  const x=info(p,i);
  const qs=CHOICE.filter(q=>QST[q.id]===i&&shown(p,q));
  const qset=new Set(qs.map(q=>q.id));
  const seq=[], placed=new Set(), grp={};
  x.its.forEach(o=>{
    const ks=condKeys(o.it.when).filter(k=>qset.has(k));
    ks.forEach(k=>{ if(!placed.has(k)){ placed.add(k); seq.push({key:"q:"+k,q:QS[k]}); } });
    if(o.s==="locked") return;
    if(ks.length) (grp[ks[0]]=grp[ks[0]]||[]).push(o);
    seq.push({key:"i:"+o.it.id,it:o.it,o});
  });
  qs.forEach(q=>{ if(!placed.has(q.id)) seq.push({key:"q:"+q.id,q}); });
  const inCard=new Set();
  seq.forEach(c=>{ if(!c.q) return; c.group=grp[c.q.id]||[]; c.big=c.group.length>GROUP_MAX; if(!c.big) c.group.forEach(o=>inCard.add(o.it.id)); });
  const out=seq.filter(c=>!(c.it&&inCard.has(c.it.id)));
  out.forEach(c=>{ c.st=cardState(p,c); c.i=i; });
  return {x,seq:out};
}
function cardState(p,c){
  if(c.q){ if(p.answers[c.q.id]===undefined) return p.skipped[c.q.id]?"skipped":"ask";
    return !c.big&&c.group.some(o=>o.s==="open")?"confirm":"done"; }
  return c.o.s;
}
function pending(c){
  if(c.st==="ask") return true;
  if(c.st==="confirm") return c.group.some(o=>o.s==="open"&&!UI.later.has(o.it.id));
  if(c.st==="open") return !UI.later.has(c.it.id);
  return false;
}
function curIdx(seq,i){
  const k=UI.at[i]; if(k==="end") return seq.length;
  if(k){ const n=seq.findIndex(c=>c.key===k); if(n>=0) return n; }
  const n=seq.findIndex(pending); return n<0?seq.length:n;
}
/* Questions answered whose actions are not all confirmed yet, at stations reached. */
function toConfirm(p){ let n=0; ST.forEach((s,i)=>{ if(!p.visited[i]) return; stationSeq(p,i).seq.forEach(c=>{ if(c.st==="confirm") n++; }); }); return n; }
const stLabel={ask:"Question to answer",skipped:"Question skipped",confirm:"Answered, actions to confirm",done:"Done",open:"To do",na:"Not applicable"};
function cardTitle(c){ return c.q?(c.q.short||c.q.label):c.it.t; }

function drawDeck(p,i,host,compact){
  const {x,seq}=stationSeq(p,i); const n=curIdx(seq,i), c=seq[n];
  const body = c ? (c.q?qCard(p,c,n,seq.length):tCard(p,c,n,seq.length)) : endCard(p,i,x,compact);
  const dots=seq.map((d,k)=>`<button type="button" class="dot ${d.st} ${k===n?"at":""}" data-goto="${d.key}" data-sti="${i}" title="${k+1}. ${esc(cardTitle(d))} · ${stLabel[d.st]||""}" aria-label="Card ${k+1}: ${esc(cardTitle(d))}"></button>`).join("")
    +`<button type="button" class="dot end ${n>=seq.length?"at":""}" data-goto="end" data-sti="${i}" title="Station summary" aria-label="Station summary"></button>`;
  /* Re-drawing the same card (a confirmation ticked, a note opened) shouldn't replay its entrance. */
  const ck=`${i}:${c?c.key:"end"}`, still=lastCard[host.id]===ck; lastCard[host.id]=ck;

    <button class="btn sm" type="button" data-nav="next" data-sti="${i}" ${n>=seq.length?"disabled":""} title="Next card (→)">Next${I("chev")}</button></div>`;
}
const lastCard={};
function navTo(i,dir){
  const {seq}=stationSeq(cur(),i); const n=curIdx(seq,i);
  const m=Math.max(0,Math.min(seq.length,n+dir));

}
function decideCount(p,q){ let n=0; LIB.items.forEach(it=>{ if(SI[it.ph]===QST[q.id]&&condKeys(it.when).includes(q.id)&&itemState(p,it)!=="hidden") n++; }); return n; }
function qCard(p,c,n,total){
  const q=c.q, a=p.answers[q.id], k=`q:${q.id}`, op=UI.open.has(k), i=c.i, answered=a!==undefined;
  const g=c.big?[]:c.group, left=g.filter(o=>o.s==="open").length, dec=answered?0:decideCount(p,q);
  const s2=answered?(left?"at":"done"):"";
  let step2="";
  if(answered){
    if(g.length) step2=`<div class="confirm"><div class="ch"><b>Confirm the actions this answer requires</b><span class="pill ${left?"q":"t"}">${g.length-left} of ${g.length} confirmed</span></div>

    else if(c.big) step2=`<div class="confirm"><div class="ch"><b>This answer brings ${c.group.length} actions</b></div><p>They follow as cards of their own, each to be confirmed when it is done.</p></div>`;

    step2+=`<div class="cfoot">${left?`<span class="hint">${I("alert")} ${left} action${left>1?"s":""} not confirmed yet</span><button class="btn" type="button" data-cont="${i}">Not done yet, continue</button>`:`<button class="btn pri" type="button" data-cont="${i}">Continue ${I("chev")}</button>`}</div>`;
  }
  return `<div class="card q">
    <div class="top2"><span class="row" style="gap:10px"><span class="pill q">${I("q")}Question</span><ol class="qsteps" aria-label="Two confirmations"><li class="${answered?"done":"at"}"><span class="n">${answered?I("check"):1}</span>Answer</li><li class="${s2}"><span class="n">${s2==="done"?I("check"):2}</span>Confirm actions</li></ol></span><span class="cpos">Card ${n+1} of ${total}</span></div>
    <p class="title">${esc(q.label)}</p>
    ${answered?"":dec?`<div class="decides">${I("lock")}Your answer decides ${dec} action${dec>1?"s":""} at this station.</div>`:""}
    <div class="answers">${q.opts.map((o,m)=>`<button type="button" data-ans="${q.id}" data-v="${o[0]}" data-sti="${i}" aria-pressed="${a===o[0]}"><span class="k">${a===o[0]?I("check"):m+1}</span>${esc(o[1])}</button>`).join("")}</div>
    ${step2}
    <div class="subacts"><button class="lnk" type="button" data-more="${k}">${op?"Hide explanation":"Why does this matter?"}</button><span class="row"><span class="keys"><kbd>1</kbd>–<kbd>${q.opts.length}</kbd> answer · <kbd>←</kbd><kbd>→</kbd> cards</span>${answered?"":`<button class="btn sm" type="button" data-skip="${q.id}">Skip for now</button>`}</span></div>
    ${op?`<div class="more"><div>${esc(q.help||"It decides which actions apply to this project.")}</div>${q.ref?`<div><span class="tag ref">${esc(q.ref)}</span></div>`:""}</div>`:""}
  </div>`;
}

  return `<div class="crow ${s}"><span class="ci">${s==="done"?I("check"):s==="na"?"–":""}</span>
    <div><div class="t" data-more="${k}" data-sti="${i}">${esc(it.t)}</div><div class="sm">${[it.ref,it.who,it.cad&&it.cad!=="once"&&cadName(it)].filter(Boolean).map(esc).join(" · ")}${s==="done"&&p.doneAt[it.id]?` · done ${fmtD(p.doneAt[it.id])}`:""}</div></div>

    ${op?moreBox(p,it):""}</div>`;
}
function dueTag(p,id){ const di=dueInfo(p.due[id]); if(!di) return ""; return `<span class="tag ${di.over?"bad":""}">${I("cal")}${di.over?`Overdue ${fmtD(di.d)}`:`Due ${fmtD(di.d)}`}</span>`; }
function tCard(p,c,n,total){
  const it=c.it, s=c.o.s, i=c.i, k=`i:${it.id}`, op=UI.open.has(k);

/* ---------- actions with undo ---------- */
function answer(p,qid,v,sti){
  const before=LIB.items.map(it=>itemState(p,it));
  const prev={a:p.answers[qid],sk:p.skipped[qid],at:sti!==undefined?UI.at[sti]:undefined};
  p.answers[qid]=v; delete p.skipped[qid]; touch(p);
  const after=LIB.items.map(it=>itemState(p,it));
  let unl=0,gone=0; before.forEach((b,k)=>{ if(b==="locked"&&after[k]!=="locked"&&after[k]!=="hidden") unl++; if(b!=="hidden"&&after[k]==="hidden") gone++; });
  /* Stay on the question so its actions can be confirmed; move on when it needs none. */
  if(sti!==undefined){ const c=stationSeq(p,sti).seq.find(c=>c.key==="q:"+qid); if(c&&c.st==="confirm") UI.at[sti]=c.key; else if(UI.at[sti]==="q:"+qid) delete UI.at[sti]; }
  const msg=unl?`Answer saved · ${unl} action${unl>1?"s":""} now required${gone?` · ${gone} not needed`:""}`:gone?`Answer saved · ${gone} action${gone>1?"s":""} not needed`:"Answer saved";
  toast(msg,()=>{ if(prev.a===undefined) delete p.answers[qid]; else p.answers[qid]=prev.a; if(prev.sk) p.skipped[qid]=true; if(sti!==undefined){ if(prev.at) UI.at[sti]=prev.at; else delete UI.at[sti]; } touch(p); if($("#dlg").open) drawDlg(); render(); });
}
function stationNow(){ return VIEW.name==="station"?VIEW.arg:VIEW.name==="map"?UI.deckSt:null; }
function act(p,id,what,sti,stay){
  const prev={s:p.status[id],t:p.doneAt[id]};
  const si=stationNow();
  const wasCleared=si!==null&&info(p,si).cleared;
  if(what==="done"){ p.status[id]="done"; p.doneAt[id]=Date.now(); }
  else if(what==="na"){ p.status[id]="na"; delete p.doneAt[id]; }
  else if(what==="undo"){ delete p.status[id]; delete p.doneAt[id]; }
  else if(what==="later"){ UI.later.add(id); if(sti!==undefined) delete UI.at[sti]; toast("Set aside for later",()=>{ UI.later.delete(id); render(); }); return render(); }
  if(sti!==undefined){ if(stay) UI.at[sti]=stay; else delete UI.at[sti]; }
  touch(p);
  const nowCleared=si!==null&&info(p,si).cleared;
  const undo=()=>{ if(prev.s) p.status[id]=prev.s; else delete p.status[id]; if(prev.t) p.doneAt[id]=prev.t; else delete p.doneAt[id]; touch(p); render(); };
  toast(nowCleared&&!wasCleared?`${ST[si].s} cleared`:what==="done"?"Confirmed done":what==="na"?"Marked not applicable":"Reopened",undo);
  render();
}

/* ---------- by frequency: what comes round daily, weekly, monthly, and what is done once ----------
   Every action carries how often it comes round ("cad" in the library; "cadBy":
   "judgement" where the procedure does not say and it was set by judgement). The
   repeating ones are ticked off once per day, week (two weeks where the procedure
   says bi-weekly) or month, in "ticks"; the rest are cleared once, as on the journey. */
const CAD=LIB.cadences||[["once","One time",""]], CADN=Object.fromEntries(CAD.map(c=>[c[0],c]));
const REP={daily:1,weekly:1,monthly:1};
const PERIOD={daily:"Today",weekly:"This week",monthly:"This month"};
function cadName(it){ return it.freq==="Bi-weekly"?"Every two weeks":(CADN[it.cad]||["","One time"])[1]; }
const pad2=n=>String(n).padStart(2,"0");
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const wd=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-wd); const y=t.getUTCFullYear(); return [y,Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)]; }
function periodKey(it,d){
  if(it.cad==="daily") return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  if(it.cad==="monthly") return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const [y,w]=isoWeek(d); return it.freq==="Bi-weekly"?`${y}-F${pad2(Math.ceil(w/2))}`:`${y}-W${pad2(w)}`;
}
function periodsBack(it,n){
  const t=today(), out=[];
  for(let k=n-1;k>=0;k--){ const d=new Date(t);
    if(it.cad==="daily") d.setDate(t.getDate()-k);
    else if(it.cad==="monthly"){ d.setDate(1); d.setMonth(t.getMonth()-k); }
    else d.setDate(t.getDate()-7*k*(it.freq==="Bi-weekly"?2:1));
    out.push({key:periodKey(it,d),d,now:k===0}); }
  return out;
}
const tickKey=(it,d)=>`${it.id}|${periodKey(it,d||today())}`;
const periodName=(it,pp)=>it.cad==="daily"?pp.d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}):it.cad==="monthly"?pp.d.toLocaleDateString(undefined,{month:"long",year:"numeric"}):`Week of ${fmtD(pp.d)}`;
function freqRows(p){ return LIB.items.map(it=>({it,s:itemState(p,it)})).filter(r=>r.s!=="hidden"); }
/* For a repeating action "done" means ticked this period; N/A ones and locked ones don't count. */
function freqCount(p,cad,rows){
  const live=rows.filter(r=>r.s!=="locked"&&!(REP[cad]&&r.s==="na"));
  const done=REP[cad]?live.filter(r=>p.ticks[tickKey(r.it)]).length:live.filter(r=>r.s==="done"||r.s==="na").length;
  return {done,total:live.length,locked:rows.filter(r=>r.s==="locked").length};
}
function viewFreq(p){
  const rows=freqRows(p); const by={}; CAD.forEach(c=>by[c[0]]=[]); rows.forEach(r=>(by[r.it.cad]||(by[r.it.cad]=[])).push(r));
  const q=UI.fq.trim().toLowerCase();
  const match=r=>!q||[r.it.t,r.it.ref,r.it.who,ST[SI[r.it.ph]].s].join(" ").toLowerCase().includes(q);
  const show=(cad,r)=>{ if(!match(r)) return false; if(UI.fshow==="all") return true;
    if(r.s==="locked") return true;
    return REP[cad]?(r.s!=="na"&&!p.ticks[tickKey(r.it)]):r.s==="open"; };
  const cads=UI.fcad==="all"?CAD.map(c=>c[0]):[UI.fcad];
  const tile=(key,name,sub,c,rep)=>`<button type="button" class="ftile ${rep?"rep":""}" data-fcad="${key}" aria-pressed="${UI.fcad===key}"><span class="k">${esc(name)}</span><span class="v">${c.done}<small> / ${c.total}</small></span><span class="bar"><i style="width:${c.total?c.done/c.total*100:0}%"></i></span><span class="s">${esc(sub)}</span></button>`;
  const allC=CAD.reduce((a,c)=>{ const k=freqCount(p,c[0],by[c[0]]); return {done:a.done+k.done,total:a.total+k.total}; },{done:0,total:0});
  const judged=rows.filter(r=>r.it.cadBy).length;
  const groups=cads.map(cad=>{
    const list=by[cad].filter(r=>show(cad,r)); const c=freqCount(p,cad,by[cad]); const meta=CADN[cad]||[cad,cad,""];
    if(!by[cad].length) return "";
    return `<section class="panel fgroup"><div class="gh"><h2>${esc(meta[1])}</h2><span>${esc(meta[2])} · ${REP[cad]?`${c.done} of ${c.total} ticked ${esc(PERIOD[cad].toLowerCase())}`:`${c.done} of ${c.total} cleared`}${c.locked?` · ${c.locked} waiting on answers`:""}</span></div>
      ${list.length?list.map(r=>fRow(p,r)).join(""):`<p class="empty" style="padding:12px 0">${UI.fshow==="todo"?(REP[cad]?`All ticked ${esc(PERIOD[cad].toLowerCase())}.`:"Nothing left to do."):"Nothing here."}</p>`}</section>`;
  }).join("");
  app.innerHTML=`
  <div class="fhead"><div><span class="eyebrow">${esc(p.answers.num||"")}</span><h1>Procedures by frequency</h1>
    <p class="muted" style="margin:4px 0 0;max-width:80ch;font-size:14px">Every action that applies to this project, by how often it comes round. Tick the daily ones each day and the weekly ones each week; one-time actions are cleared once, the same as on the journey.</p></div></div>
  <div class="ftiles" role="group" aria-label="Filter by frequency">
    ${tile("all","All","Every frequency",allC,false)}
    ${CAD.map(c=>tile(c[0],c[1],REP[c[0]]?`ticked ${PERIOD[c[0]].toLowerCase()}`:"cleared",freqCount(p,c[0],by[c[0]]),!!REP[c[0]])).join("")}
  </div>
  <div class="ftools"><input type="search" id="fq" placeholder="Search actions, procedures, who…" value="${esc(UI.fq)}" aria-label="Search">
    <div class="seg" role="group" aria-label="Show"><button type="button" data-fshow="todo" aria-pressed="${UI.fshow==="todo"}">Still to do</button><button type="button" data-fshow="all" aria-pressed="${UI.fshow==="all"}">Everything</button></div></div>
  ${groups}
  ${judged?`<p class="muted" style="font-size:12.5px;max-width:80ch">${judged} actions don't say in the procedure how often they come round; their frequency was set by judgement and is marked <span class="judg" style="color:var(--lock)">≈ by judgement</span>.</p>`:""}`;
  const f=$("#fq"); f.oninput=()=>{ UI.fq=f.value; const pos=f.selectionStart; render(); const g=$("#fq"); g.focus(); try{ g.setSelectionRange(pos,pos); }catch(e){} };
}
function fRow(p,r){
  const it=r.it, s=r.s, rep=REP[it.cad];
  const meta=[ST[SI[it.ph]].s,it.ref,it.who].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")
    +(it.freq&&it.freq!==cadName(it)?`<span>${esc(it.freq)}</span>`:it.freq==="Bi-weekly"?`<span>Every two weeks</span>`:"")
    +(it.cadBy?`<span class="judg" title="The procedure doesn't say how often; this frequency was set by judgement.">≈ by judgement</span>`:"");
  const title=`<div class="t" data-st="${SI[it.ph]}" title="Open its station">${esc(it.t)}</div>`;
  if(s==="locked"){ const need=unknownKeys(it.when,p.answers).map(qname).join(", ");
    return `<div class="frow lk"><span class="lkic" style="color:var(--lock)">${I("lock")}</span><div>${title}<div class="sm">${meta}<span style="color:var(--lock)">Waiting on: ${esc(need)}</span></div></div><div class="right"><button class="btn sm" type="button" data-a="bag">Answer</button></div></div>`; }
  if(rep&&s!=="na"){ const on=!!p.ticks[tickKey(it)]; const hist=periodsBack(it,it.cad==="daily"?7:6);
    return `<div class="frow ${on?"ticked":""}"><input type="checkbox" class="ck" data-tick="${it.id}" ${on?"checked":""} aria-label="${esc(PERIOD[it.cad])}: ${esc(it.t)}" title="Done ${esc(PERIOD[it.cad].toLowerCase())}">
      <div>${title}<div class="sm">${meta}</div></div>
      <div class="right"><span class="hlab">${esc(PERIOD[it.cad])}${on?" ✓":""}</span><span class="hist">${hist.map(pp=>`<button type="button" class="hd ${p.ticks[it.id+"|"+pp.key]?"on":""} ${pp.now?"now":""}" data-tickp="${it.id}|${pp.key}" title="${esc(periodName(it,pp))}${p.ticks[it.id+"|"+pp.key]?": done":""}" aria-label="${esc(periodName(it,pp))}"></button>`).join("")}</span></div></div>`; }
  return `<div class="frow ${s}"><input type="checkbox" class="ck" data-ck="${it.id}" ${s==="done"?"checked":""} ${s==="na"?"disabled":""} aria-label="Done: ${esc(it.t)}">
    <div>${title}<div class="sm">${meta}${s==="done"&&p.doneAt[it.id]?`<span>Done ${fmtD(p.doneAt[it.id])}</span>`:""}${p.due[it.id]&&s==="open"?dueTag(p,it.id):""}</div></div>
    <div class="right"><button class="btn sm" type="button" data-do="${s==="na"?"undo":"na"}" data-id="${it.id}">${s==="na"?"Undo N/A":"N/A"}</button></div></div>`;
}
function tick(p,key){
  const on=!!p.ticks[key]; if(on) delete p.ticks[key]; else p.ticks[key]=Date.now(); touch(p);
  toast(on?"Tick removed":"Ticked off",()=>{ if(on) p.ticks[key]=Date.now(); else delete p.ticks[key]; touch(p); render(); });
  render();
}

/* ---------- dialog: ? bag, all answers, sources ---------- */
let DTAB="wait";
function openDlg(tab){ DTAB=tab||(bag(cur()).length?"wait":"all"); drawDlg(); const d=$("#dlg"); if(!d.open) d.showModal(); }
function drawDlg(){
  const p=cur(); const b=bag(p); const d=$("#dlg");
  if(DTAB==="sources"){
    d.innerHTML=`<div class="dlg"><div class="h"><h2>Procedure sources</h2><button class="btn sm" type="button" data-close>Close</button></div><div></div>
      <div class="body"><p class="muted" style="margin:0">Every card cites the procedure section it comes from. Check the current revision on the QMS before relying on a detail. Lecture tips come from the 2008 "Project Management for Design" workshop and are good practice, not requirements.</p>
      <div class="srcs">${Object.entries(LIB.sources).map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}</div><p class="muted" style="font-size:12.5px;margin:0">${esc(LIB.version)}</p></div></div>`;
    return;
  }
  const qblock=q=>`<div class="dq"><span class="st">${esc(ST[QST[q.id]].s)}</span><span class="l">${esc(q.label)}</span><div class="chips">${q.opts.map(o=>`<button type="button" data-ans="${q.id}" data-v="${o[0]}" aria-pressed="${p.answers[q.id]===o[0]}">${esc(o[1])}</button>`).join("")}</div></div>`;
  let body="";
  if(DTAB==="wait"){ body = b.length? `<p class="muted" style="margin:0">Answer what you can. Each answer unlocks the cards that need it, or removes the ones that don't apply.</p>${b.map(qblock).join("")}` : `<p class="muted">Nothing waiting. Every question so far is answered.</p>`; }
  else {
    body=`<div class="dsec">Project</div><div class="form" style="max-width:none;padding:0">${TEXTQ.map(q=>`<label for="d-${q.id}">${esc(q.label)}<input id="d-${q.id}" data-txt="${q.id}" value="${esc(p.answers[q.id]||"")}"${SRV&&(q.id==="num"||q.id==="title")?" readonly title=\"Change it in the project's Setup\"":""}></label>`).join("")}</div>${SRV?`<p class="muted" style="font-size:12.5px;margin:4px 0 0">The project number and title come from the project's Setup.</p>`:""}`;
    ST.forEach((s,i)=>{ const qs=CHOICE.filter(q=>QST[q.id]===i&&shown(p,q)&&(!unanswered(p,q)||p.visited[i]||p.skipped[q.id])); if(qs.length) body+=`<div class="dsec">${esc(s.s)}</div>${qs.map(qblock).join("")}`; });
    body+=`<label class="row muted" style="font-size:13.5px"><input type="checkbox" id="tipT" ${UI.tips?"checked":""}> Show good-practice tips from the PM workshop</label>`;
  }
  d.innerHTML=`<div class="dlg"><div class="h"><h2>${DTAB==="wait"?"Questions waiting":"Project answers"}</h2><button class="btn sm" type="button" data-close>Close</button></div>
    <div class="tabs"><button type="button" data-tab="wait" aria-pressed="${DTAB==="wait"}">Waiting · ${b.length}</button><button type="button" data-tab="all" aria-pressed="${DTAB==="all"}">All answers</button></div>
    <div class="body">${body}</div></div>`;
}

function confirmBox(msg,yes){ return new Promise(res=>{ const d=$("#dlg"); d.innerHTML=`<div class="dlg"><div class="body"><p style="margin:0 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="cNo">Cancel</button><button class="btn pri" type="button" id="cYes">${esc(yes)}</button></div></div></div>`;
  d.showModal(); $("#cNo").onclick=()=>{d.close();res(false);}; $("#cYes").onclick=()=>{d.close();res(true);}; }); }

app.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-more],[data-st]"); if(!t) return; const p=cur(); const d=t.dataset;
  if(d.a==="new"){ const id=uid(); DB.projects[id]={id,created:Date.now(),updated:Date.now(),answers:{},status:{},notes:{},due:{},skipped:{},doneAt:{},visited:{},ticks:{}}; DB.current=id; save(); return go("start"); }
  if(d.a==="import") return $("#importFile").click();
  if(d.a==="expall") return download(`pm-journeys-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:"pm-procedure-checklist",exported:new Date().toISOString(),projects:DB.projects},null,2),"application/json");
  if(d.open){ DB.current=d.open; save(); UI.later.clear(); return go(DB.projects[d.open].answers.num?"map":"start"); }
  if(d.dup){ const s=DB.projects[d.dup]; const id=uid(); const a={...s.answers}; delete a.num; a.title=(a.title||"")+" (copy)"; DB.projects[id]={id,created:Date.now(),updated:Date.now(),answers:a,status:{},notes:{},due:{},skipped:{},doneAt:{},visited:{},ticks:{}}; DB.current=id; save(); return go("start"); }
  if(d.del){ const s=DB.projects[d.del]; if(await confirmBox(`Delete ${s.answers.num||"this project"} with all its progress and notes? This can't be undone unless you have a backup.`,"Delete project")){ delete DB.projects[d.del]; if(DB.current===d.del) DB.current=null; save(); go("home"); } return; }
  const sti=d.sti!==undefined?+d.sti:undefined;
  if(d.a==="map") return go("map");
  if(d.a==="bag") return openDlg("wait");
  if(d.a==="replay"){ UI.later.clear(); if(sti!==undefined) delete UI.at[sti]; return render(); }
  if(d.pick!==undefined){ UI.deckSt=+d.pick; UI.later.clear(); if(VIEW.name!=="map") return go("map"); render(); const dk=$(".deckcol"); if(dk&&window.innerWidth<920) dk.scrollIntoView({block:"start",behavior:"smooth"}); return; }
  if(d.st!==undefined){ UI.later.clear(); return go("station",+d.st); }
  if(d.mode){ UI.mode=d.mode; saveUI(); return render(); }
  if(d.nav&&!t.disabled){ navTo(sti,d.nav==="prev"?-1:1); return render(); }
  if(d.goto){ UI.at[sti]=d.goto; return render(); }
  if(d.cont!==undefined){ const i=+d.cont; const c=stationSeq(p,i).seq[curIdx(stationSeq(p,i).seq,i)];
    if(c&&c.q&&c.group) c.group.forEach(o=>{ if(o.s==="open") UI.later.add(o.it.id); });
    delete UI.at[i]; return render(); }
  if(d.more){ UI.open.has(d.more)?UI.open.delete(d.more):UI.open.add(d.more); return render(); }
  if(d.ans){ answer(p,d.ans,d.v,sti); return render(); }
  if(d.skip){ const i=QST[d.skip]; p.skipped[d.skip]=true; delete UI.at[i]; touch(p); toast("Moved to questions waiting",()=>{ delete p.skipped[d.skip]; touch(p); render(); }); return render(); }
  if(d.do) return act(p,d.id,d.do,sti,d.stay);
  if(d.fcad){ UI.fcad=d.fcad; saveUI(); return render(); }
  if(d.fshow){ UI.fshow=d.fshow; saveUI(); return render(); }
  if(d.tickp) return tick(p,d.tickp);
});
app.addEventListener("change",e=>{ const p=cur(); const d=e.target.dataset;

document.addEventListener("keydown",e=>{
  const host=VIEW.name==="station"&&UI.mode==="cards"?$("#stage"):VIEW.name==="map"?$("#deck"):null;
  if(!host||$("#dlg").open) return;
  if(e.target.closest&&e.target.closest("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ const b=host.querySelector(`[data-nav="${e.key==="ArrowLeft"?"prev":"next"}"]`); if(b&&!b.disabled){ e.preventDefault(); b.click(); } return; }
  const card=host.querySelector(".card"); if(!card) return; const k=e.key.toLowerCase();
  if(card.classList.contains("q")){ if(/^[1-9]$/.test(k)){ const b=card.querySelectorAll("[data-ans]")[+k-1]; if(b){ e.preventDefault(); b.click(); } } else if(k==="s"){ e.preventDefault(); card.querySelector("[data-skip]")?.click(); } else if(k==="enter"&&!e.target.closest("button")){ const b=card.querySelector("[data-cont]"); if(b){ e.preventDefault(); b.click(); } } }
  else { const m={d:"done",n:"na",l:"later"}[k]; if(m){ e.preventDefault(); card.querySelector(`[data-do="${m}"]`)?.click(); } else if(k==="i"){ e.preventDefault(); card.querySelector("[data-more]")?.click(); } }
});

function exportCsv(p){
  const R=[["Station","Action","Detail","Who","Record / form","Procedure","Frequency","Topic","Applies because / waiting on","Status","Completed","Target date","Note"]];
  summary(p).rows.forEach(({it,s})=>R.push([ST[SI[it.ph]].s,it.t,it.d||"",it.who||"",it.rec||"",it.ref||"",cadName(it)+(it.cadBy?" (by judgement)":""),it.topic||"",s==="locked"?"Waiting on: "+unknownKeys(it.when,p.answers).map(qname).join(", "):whyText(it.when,p.answers),({done:"Done",na:"N/A",locked:"Locked",open:"Open"})[s],p.doneAt[it.id]?new Date(p.doneAt[it.id]).toISOString().slice(0,10):"",p.due[it.id]||"",p.notes[it.id]||""]));
  download(`${fname(p)}-checklist.csv`,"﻿"+R.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n"),"text/csv;charset=utf-8");
}
function report(p){
  const S=summary(p), a=p.answers;
  let h=`<div class="rh"><div><div class="rk">Project status report</div><h1>${esc(a.num||"")} ${esc(a.title||"")}</h1><div class="meta">${[a.pm&&"PM: "+esc(a.pm),a.pd&&"PD: "+esc(a.pd)].filter(Boolean).join(" · ")}</div></div><div class="meta">Generated ${fmtD(Date.now())}</div></div>

  <h2>Progress by station</h2><table><thead><tr><th>Station</th><th>Status</th><th class="n">Done</th><th class="n">N/A</th><th class="n">Open</th><th class="n">Locked</th></tr></thead><tbody>
  ${S.vis.map(x=>`<tr><td>${esc(ST[x.i].s)}</td><td>${x.cleared?"Cleared":p.visited[x.i]?"In progress":"Not started"}</td><td class="n">${x.done}</td><td class="n">${x.na}</td><td class="n">${x.open}</td><td class="n">${x.locked}</td></tr>`).join("")}</tbody></table>`;
  const open=S.rows.filter(r=>r.s==="open");
  h+=`<h2>Open actions (${open.length})</h2>`+(open.length?`<table><thead><tr><th>Station</th><th>Action</th><th>Procedure</th><th>Who</th><th>Target</th><th>Note</th></tr></thead><tbody>${open.map(({it})=>{ const di=dueInfo(p.due[it.id]); return `<tr><td>${esc(ST[SI[it.ph]].s)}</td><td>${esc(it.t)}</td><td>${esc(it.ref||"")}</td><td>${esc(it.who||"")}</td><td class="${di&&di.over?"over":""}">${di?fmtD(di.d):""}</td><td>${esc(p.notes[it.id]||"")}</td></tr>`; }).join("")}</tbody></table>`:"<p>None.</p>");
  const bq=bag(p);
  if(bq.length) h+=`<h2>Questions waiting (${bq.length})</h2><table><thead><tr><th>Station</th><th>Question</th></tr></thead><tbody>${bq.map(q=>`<tr><td>${esc(ST[QST[q.id]].s)}</td><td>${esc(q.label)}</td></tr>`).join("")}</tbody></table>`;
  const ans=CHOICE.filter(q=>p.answers[q.id]!==undefined&&shown(p,q));
  if(ans.length) h+=`<h2>Project profile</h2><table><tbody>${ans.map(q=>`<tr><td style="width:40%">${esc(q.short||q.label)}</td><td>${esc(label(q,p.answers[q.id]))}</td></tr>`).join("")}</tbody></table>`;
  const done=S.rows.filter(r=>r.s==="done");
  if(done.length) h+=`<h2>Completed actions (${done.length})</h2><table><thead><tr><th>Station</th><th>Action</th><th>Procedure</th><th>Completed</th></tr></thead><tbody>${done.map(({it})=>`<tr><td>${esc(ST[SI[it.ph]].s)}</td><td>${esc(it.t)}</td><td>${esc(it.ref||"")}</td><td>${p.doneAt[it.id]?fmtD(p.doneAt[it.id]):""}</td></tr>`).join("")}</tbody></table>`;
  h+=`<div class="foot">Generated by PM Project Journey from ${Object.keys(LIB.sources).length} company procedures (${esc(LIB.version)}). Procedure references are cited for each action; confirm the current revision on the QMS.</div>`;
  $("#report").innerHTML=h; window.print();
}
$("#importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.projects) throw 0; let n=0; Object.values(d.projects).forEach(p=>{ if(!p||!p.answers) return; const id=DB.projects[p.id]?uid():(p.id||uid()); DB.projects[id]={...p,id}; fix(DB.projects[id]); n++; }); save(); toast(`Imported ${n} project${n===1?"":"s"}`); go("home"); }catch(err){ toast("That file isn't a backup from this tool."); } e.target.value=""; };
  r.readAsText(f); });

VIEW = SRV ? {name:"map"} : DB.current&&DB.projects[DB.current]&&DB.projects[DB.current].answers.num ? {name:"map"} : {name:"home"};
if(VIEW.name==="map"&&location.hash==="#freq") VIEW={name:"freq"};
render();
})();
</script>
</body>
</html>
