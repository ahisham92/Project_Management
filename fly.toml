# Fly.io configuration. First time:
#
#   fly launch --no-deploy --copy-config
#   fly volumes create project_data --size 1
#   fly secrets set SECRET_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
#   fly deploy
#
# The volume is what keeps the database between deploys.
app = "project-control"
primary_region = "cdg"           # change to the region nearest your team

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATA_DIR = "/data"
  HTTPS_ONLY = "true"            # Fly terminates TLS in front of the app
  ALLOW_SIGNUP = "true"          # set to false once your team has accounts

[mounts]
  source = "project_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine only: the database is a file on one volume, so a second machine
  # would have its own copy and the two would drift apart.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
