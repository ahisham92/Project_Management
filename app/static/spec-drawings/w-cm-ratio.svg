<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Water to cementitious materials ratio: mass of water divided by mass of cement plus supplementary materials"><title>Water to cementitious materials ratio: mass of water divided by mass of cement plus supplementary materials</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M180 150L164 186L196 186Z" style="fill:var(--grid)"/><path d="M150 186L210 186"/><path d="M60 150L300 150" stroke-width="2.5"/><circle cx="180" cy="150" r="2.5" fill="currentColor" stroke="none"/><path d="M80 150L80 140"/><path d="M280 150L280 140"/><path d="M40 140L120 140" stroke-width="2"/><path d="M240 140L320 140" stroke-width="2"/><path d="M58 138L62 106L98 106L102 138Z"/><path d="M59.5 124L100.5 124L102 138H58Z" style="fill:var(--series-1);fill-opacity:.15;stroke:none"/><path d="M60 124q2.5 -1.5 5 0t5 0q2.5 -1.5 5 0t5 0q2.5 -1.5 5 0t5 0q2.5 -1.5 5 0t5 0" style="stroke:var(--series-1)"/><path d="M248 138L250 110Q257 104 263 108Q269 104 276 110L278 138Z" style="fill:var(--grid)"/><path d="M282 138L284 110Q291 104 297 108Q303 104 310 110L312 138Z" style="fill:var(--grid)"/></g><g fill="currentColor" font-size="11" font-family="inherit"><text x="80" y="170" text-anchor="middle">water</text><text x="280" y="170" text-anchor="middle">cement + SCMs</text><text x="180" y="30" text-anchor="middle" font-weight="600">w/cm = mass of water ÷ mass of cementitious</text><text x="180" y="48" text-anchor="middle">lower w/cm: stronger, less permeable</text><text x="180" y="205" text-anchor="middle">e.g. 180 kg ÷ 400 kg = 0.45</text></g></svg>
