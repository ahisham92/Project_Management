function renderOverview() {
  const projects = myProjects();
  const everything = [];
  projects.forEach(p => p.sheets.forEach(s => visibleComments(p, s).forEach(({ c }) => everything.push(c))));
  const counts = stats(everything);

  const rows = projects.map(p => {
    const mine = [];
    p.sheets.forEach(s => visibleComments(p, s).forEach(({ c }) => mine.push(c)));
    const c = stats(mine);
    return `<tr class="row" data-open-project="${esc(p.id)}">
      <td><strong>${esc(p.name)}</strong>${isAdmin(p) ? ' <span class="chip admin">admin</span>' : ""}</td>
      <td class="muted">${esc(roleIn(p))}${myTrade(p) ? " · " + esc(myTrade(p)) : ""}</td>
      <td>${p.sheets.length}</td>
      <td>${c.open ? `<span class="chip open">${c.open} open</span>` : '<span class="chip closed">all closed</span>'}</td>
      <td>${c.late ? `<span class="chip late">${c.late} late</span>` : '<span class="muted">—</span>'}</td>
      <td class="muted">${p.members.length + 1} people</td>
    </tr>`;
  }).join("");

  view().innerHTML = `
    <section class="card">
      <div class="sheet-head">
        <div><h1>Your projects</h1>
          <p class="muted">Everything you can see, across every project you are on.</p></div>
        <div class="exports"><button class="button" id="new-project">Create a project</button></div>
      </div>
      <div class="tiles">${tilesHtml(counts)}</div>
    </section>

    <section class="card">
      <h2>Projects</h2>
      ${projects.length ? `<table class="list">
        <thead><tr><th>Project</th><th>Your role</th><th>Sheets</th><th>Open</th><th>Late</th><th>Team</th></tr></thead>
        <tbody>${rows}</tbody></table>`
        : '<p class="empty">No projects yet. Create one, then open a CRS sheet inside it.</p>'}
    </section>`;
}

function renderProject() {
  const p = project();
  const mine = [];
  p.sheets.forEach(s => visibleComments(p, s).forEach(({ c }) => mine.push(c)));
  const counts = stats(mine);

  const sheetRows = p.sheets.map(s => {
    const visible = visibleComments(p, s).map(v => v.c);
    const c = stats(visible);
    return `<tr class="row" data-open-sheet="${esc(s.id)}">
      <td><strong>${esc(s.title)}</strong><div class="muted">${esc(s.fileName)}</div></td>
      <td>${c.total}</td>
      <td>${c.open ? `<span class="chip open">${c.open}</span>` : '<span class="chip closed">0</span>'}</td>
      <td>${c.late ? `<span class="chip late">${c.late}</span>` : '<span class="muted">—</span>'}</td>
      <td class="muted">${esc(s.savedAt)}</td>
      ${seesAll(p) ? `<td><button class="link danger" data-delete-sheet="${esc(s.id)}">Delete</button></td>` : "<td></td>"}
    </tr>`;
  }).join("");

  const trades = new Map();
  mine.forEach(comment => {
    const name = comment.trade || "Unassigned";
    const row = trades.get(name) || { open: 0, late: 0 };
    if (!isClosed(comment)) row.open++;
    if (isLate(comment)) row.late++;
    trades.set(name, row);
  });
  const tradeRows = [...trades.entries()].sort((a, b) => b[1].open - a[1].open).map(([name, row]) => {
    const trade = findTrade(p, name);
    return `<tr><td>${esc(name)}</td>
      <td class="muted">${trade ? esc(trade.contactName || "") : '<span class="muted">no contact set</span>'}</td>
      <td class="center">${row.open}</td>
      <td class="center">${row.late ? `<span class="chip late">${row.late}</span>` : "—"}</td>
      <td>${trade && trade.email ? `<button class="link" data-email-trade="${esc(name)}">Email ${esc(trade.email)}</button>`
        : '<span class="muted">—</span>'}</td></tr>`;
  }).join("");

  view().innerHTML = `
    <section class="card">
      <div class="sheet-head">
        <div>
          <button class="back" data-go="overview">All projects</button>
          <h1>${esc(p.name)}</h1>
          <p class="muted">You are ${esc(roleIn(p))}${myTrade(p) ? " for " + esc(myTrade(p)) : ""}
            ${isAdmin(p) ? "and you administer this project" : ""} ·
            ${seesAll(p) ? "you see every comment" : "you see the comments for your trade"}</p>
        </div>
        <div class="exports">
          ${canManageMembers(p) ? '<button class="ghost" data-go="settings">Project settings</button>' : ""}
          <button class="button" id="open-file">Open a CRS sheet</button>
        </div>
      </div>
      <div class="tiles">${tilesHtml(counts)}</div>
    </section>

    <section class="card">
      <h2>Sheets</h2>
      ${p.sheets.length ? `<table class="list">
        <thead><tr><th>Document</th><th>Comments</th><th>Open</th><th>Late</th><th>Saved</th><th></th></tr></thead>
        <tbody>${sheetRows}</tbody></table>`
        : '<p class="empty">No sheets in this project yet.</p>'}
    </section>

    <section class="card">
      <h2>By trade</h2>
      <table class="list"><thead><tr><th>Trade</th><th>Responsible</th><th>Open</th><th>Late</th><th></th></tr></thead>
        <tbody>${tradeRows || '<tr><td colspan="5" class="muted">Nothing yet.</td></tr>'}</tbody></table>
    </section>`;
}

function renderSheet() {
  const p = project();
  const s = sheet();
  const query = ui.query.trim().toLowerCase();
  const allowed = visibleComments(p, s);
  const visible = allowed.filter(({ c }) => {
    if (ui.filter === "open" && isClosed(c)) return false;
    if (ui.filter === "closed" && !isClosed(c)) return false;
    if (ui.filter === "late" && !isLate(c)) return false;
    if (ui.filter === "awaiting" && (c.messages || []).filter(m => !isDraft(m)).length) return false;
    if (ui.filter === "drafts" && !isDraft(c) && !(c.messages || []).some(isDraft)) return false;
    if (query) {
      const hay = [c.sn, c.reviewer, c.observation, c.response, c.trade, c.reference].join(" ").toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  const counts = stats(allowed.map(v => v.c));
  const infoRows = INFO_LABELS.filter(([key]) => s.info[key])
    .map(([key, , label]) => `<dt>${esc(label)}</dt><dd>${esc(s.info[key])}</dd>`).join("");

  const rows = visible.map(({ c, i }) => {
    const replies = (c.messages || []).filter(m => !isDraft(m)).length;
    const drafts = (c.messages || []).filter(isDraft).length + (isDraft(c) ? 1 : 0);
    const files = (c.attachments || []).length +
      (c.messages || []).reduce((n, m) => n + (m.attachments || []).length, 0);
    return `<tr class="row ${isClosed(c) ? "is-closed" : ""}" data-open-comment="${i}">
      <td>${esc(c.sn)}${isDraft(c) ? ' <span class="chip draft">Draft</span>' : ""}</td>
      <td class="text">${esc(c.observation)}</td>
      <td class="muted">${esc(c.trade || "—")}</td>
      <td class="${isLate(c) ? "late-text" : "muted"}">${esc(c.due || "—")}</td>
      <td class="center">${replies || '<span class="muted">—</span>'}${drafts ? ` <span class="chip draft">${drafts}</span>` : ""}</td>
      <td class="center">${files || '<span class="muted">—</span>'}</td>
      <td><button class="chip ${isClosed(c) ? "closed" : (isLate(c) ? "late" : "open")}" data-toggle="${i}">
        ${isClosed(c) ? "Closed" : (isLate(c) ? "Late" : "Open")}</button></td>
    </tr>`;
  }).join("");

  const tabs = [["all", "All"], ["open", "Open"], ["late", "Late"], ["awaiting", "No reply yet"],
    ["closed", "Closed"], ["drafts", "Drafts"]]
    .map(([key, label]) => `<button class="tab ${ui.filter === key ? "on" : ""}" data-filter="${key}">${label}</button>`).join("");

  const tradeSends = seesAll(p)
    ? (p.settings.trades || []).map(t =>
        `<button class="ghost" data-send-trade="${esc(t.name)}">Send ${esc(t.name)}'s comments</button>`).join("")
    : "";

  view().innerHTML = `
    <section class="card">
      <div class="sheet-head">
        <div>
          <button class="back" data-go="project">${esc(p.name)}</button>
          <h1>${esc(s.title)}</h1>
          <p class="muted">${esc(s.fileName)} · ${p.settings.mode === "live" ? "live comments" : "comments published in batches"}
            ${seesAll(p) ? "" : "· you are shown the comments for " + esc(myTrade(p) || "your trade")}</p>
        </div>
        <div class="exports">
          ${counts.drafts ? `<button class="ghost" id="publish-all">Publish ${counts.drafts} draft${counts.drafts > 1 ? "s" : ""}</button>` : ""}
          <button class="button" data-export="working">Save working copy</button>
          <button class="ghost" data-export="clean">Export clean form</button>
        </div>
      </div>
      <dl class="info">${infoRows}</dl>
      ${tradeSends ? `<div class="send-row"><span class="hint">Send one trade only what is theirs:</span>${tradeSends}</div>` : ""}
    </section>

    <section class="card">
      <div class="tiles">${tilesHtml(counts)}</div>
    </section>

    <section class="card">
      <div class="filters">
        <nav>${tabs}</nav>
        <div class="search"><input id="search" value="${esc(ui.query)}" placeholder="Search comments"></div>
      </div>
      ${rows ? `<table class="list"><thead><tr>
        <th>S/N</th><th>Comment</th><th>Trade</th><th>Due</th><th>Replies</th><th>Files</th><th>Status</th>
      </tr></thead><tbody>${rows}</tbody></table>`
      : '<p class="empty">Nothing matches this filter.</p>'}
    </section>

    ${canRaise(p) ? `<section class="card">
      <details id="new-comment">
        <summary>Raise a new comment</summary>
        <div class="grid-form">
          <label>S/N <input id="nc-sn" placeholder="auto"></label>
          <label>Reviewer <input id="nc-reviewer" value="${esc(me().name)}"></label>
          <label>Source (title / page / clause) <input id="nc-source" value="N/A"></label>
          <label>Trade / department <select id="nc-trade"><option value="">Unassigned</option>
            ${(p.settings.trades || []).map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("")}
          </select></label>
          <label>Due date <input type="date" id="nc-due" value="${esc(addDays(p.settings.dueDays))}"></label>
          <label>Reference document <input id="nc-reference" value="${esc(s.info.report_no || "")}"></label>
          <label>Returned code <select id="nc-code"><option value=""></option>
            ${Object.entries(CODES).map(([code, meaning]) => `<option value="${code}">${code} = ${meaning}</option>`).join("")}
          </select></label>
          <label class="wide">Observation / comment <textarea id="nc-observation" rows="3"></textarea></label>
          <button class="primary" id="add-comment">Add comment</button>
        </div>
      </details>
    </section>` : ""}`;

  const search = document.getElementById("search");
  search.addEventListener("input", () => {
    ui.query = search.value;
    const position = search.selectionStart;
    renderSheet();
    const again = document.getElementById("search");
    again.focus();
    again.setSelectionRange(position, position);
  });
}

function renderComment() {
  const p = project();
  const s = sheet();
  const index = ui.commentIndex;
  const comment = s.comments[index];
  const allowed = visibleComments(p, s);
  if (!allowed.some(v => v.i === index)) {
    ui.view = "sheet"; renderSheet();
    flash("That comment belongs to another trade.", "warn");
    return;
  }
  const position = allowed.findIndex(v => v.i === index);
  const closed = isClosed(comment);
  const trade = findTrade(p, comment.trade);

  const messages = (comment.messages || []).map((m, i) => `
    <li class="msg ${esc(String(m.role).toLowerCase().replace(/\s+/g, "-"))} ${isDraft(m) ? "is-draft" : ""}">
      <div class="msg-head"><strong>${esc(m.author)}</strong>
        <span class="role">${esc(m.role)}</span>
        ${m.organization ? `<span class="muted">${esc(m.organization)}</span>` : ""}
        <span class="muted">${esc(m.at)}</span><span class="muted">reply ${i + 1}</span>
        ${isDraft(m) ? '<span class="chip draft">Draft</span>' : ""}</div>
      <div class="msg-body">${esc(m.body)}</div>
      ${(m.attachments || []).length ? `<div class="attachments">${(m.attachments || [])
        .map(a => attachmentHtml(a, "m" + m.id)).join("")}</div>` : ""}
      ${isDraft(m) && norm(m.authorEmail) === norm(store.session)
        ? `<div class="msg-actions"><button class="link" data-publish-message="${esc(m.id)}">Publish this reply</button></div>` : ""}
    </li>`).join("");

  const tradeOptions = ['<option value="">Unassigned</option>']
    .concat((p.settings.trades || []).map(t =>
      `<option value="${esc(t.name)}" ${norm(t.name) === norm(comment.trade) ? "selected" : ""}>${esc(t.name)}</option>`))
    .join("");

  view().innerHTML = `
    <section class="card">
      <button class="back" data-go="sheet">${esc(s.title)}</button>
      <div class="sheet-head">
        <h1>Comment ${esc(comment.sn)}
          <span class="chip ${closed ? "closed" : (isLate(comment) ? "late" : "open")}">
            ${closed ? "Closed" : (isLate(comment) ? "Late" : "Open")}</span>
          ${isDraft(comment) ? '<span class="chip draft">Draft</span>' : ""}</h1>
        <div class="exports">
          <button class="ghost" data-move="-1" ${position <= 0 ? "disabled" : ""}>Previous</button>
          <span class="muted">${position + 1} of ${allowed.length}</span>
          <button class="ghost" data-move="1" ${position >= allowed.length - 1 ? "disabled" : ""}>Next</button>
        </div>
      </div>
      <p class="observation">${esc(comment.observation)}</p>
      ${(comment.attachments || []).length ? `<div class="attachments">${(comment.attachments || [])
        .map(a => attachmentHtml(a, "c" + comment.id)).join("")}</div>` : ""}
      ${isDraft(comment) && norm(comment.authorEmail) === norm(store.session)
        ? '<p><button class="ghost" data-publish-comment="1">Publish this comment</button></p>' : ""}

      <div class="assign">
        <label>Trade / department
          <select id="assign-trade" ${canAssign(p) ? "" : "disabled"}>${tradeOptions}</select></label>
        <label>Due date
          <input type="date" id="assign-due" value="${esc(comment.due || "")}" ${canAssign(p) ? "" : "disabled"}></label>
        <div class="assign-contact">
          ${trade ? `Replies expected from <strong>${esc(trade.contactName || trade.name)}</strong>
            ${trade.organization ? "· " + esc(trade.organization) : ""}
            ${trade.email ? `· <button class="link" data-email-trade="${esc(trade.name)}">${esc(trade.email)}</button>` : ""}`
            : '<span class="muted">No contact set for this trade.</span>'}
        </div>
      </div>
      ${canAssign(p) ? "" : '<p class="hint">Only a PM or the project administrator changes the trade and the due date.</p>'}
    </section>

    <section class="card">
      <h2>Thread</h2>
      ${messages ? `<ol class="thread">${messages}</ol>` :
        `<p class="empty">No replies yet.${comment.originalResponse
          ? " The sheet carried this response: “" + esc(comment.originalResponse) + "”." : ""}</p>`}
      ${canReply(p) ? `
        <textarea id="reply-body" rows="4" placeholder="Write a reply as ${esc(me().name)}"></textarea>
        <div class="attach-row">
          <button class="ghost" id="attach-reply">Attach a photo or file</button>
          <span class="hint">Photos go into the exported sheet; other files travel inside it and are listed by name.</span>
        </div>
        <div class="attachments" id="pending-attachments"></div>
        <div class="reply-actions">
          <span class="hint">Posting as ${esc(me().name)} · ${esc(roleIn(p))}</span>
          <label><input type="checkbox" id="reply-close"> Close this comment</label>
          <button class="primary" id="post-reply">${p.settings.mode === "live" ? "Post reply" : "Save as draft"}</button>
        </div>
        <p class="hint">${p.settings.mode === "live"
          ? "Replies are part of the sheet as soon as you post them."
          : "Replies stay drafts until you publish them, and drafts never leave this browser."}
          A reply from the designer side also becomes the Response cell in the exported sheet.</p>`
        : '<p class="hint">You are not a member of this project, so you can read but not reply.</p>'}
    </section>

    ${canAssign(p) ? `<section class="card">
      <details>
        <summary>Edit the sheet fields for this comment</summary>
        <div class="grid-form">
          <label>S/N <input id="ec-sn" value="${esc(comment.sn)}"></label>
          <label>Reviewer <input id="ec-reviewer" value="${esc(comment.reviewer || "")}"></label>
          <label>Source <input id="ec-source" value="${esc(comment.source || "")}"></label>
          <label>Reference <input id="ec-reference" value="${esc(comment.reference || "")}"></label>
          <label>Returned code <select id="ec-code"><option value=""></option>
            ${Object.entries(CODES).map(([code, meaning]) =>
              `<option value="${code}" ${comment.returned_code === code ? "selected" : ""}>${code} = ${meaning}</option>`).join("")}
          </select></label>
          <label>Sign-off <select id="ec-signoff">
            <option ${closed ? "" : "selected"}>Open</option>
            <option ${closed ? "selected" : ""}>Closed</option></select></label>
          <label class="wide">Observation <textarea id="ec-observation" rows="3">${esc(comment.observation)}</textarea></label>
          <button class="primary" id="save-comment">Save</button>
        </div>
        <p><button class="link" id="attach-comment">Attach a photo or file to the comment</button>
           · <button class="link danger" id="delete-comment">Delete comment</button></p>
      </details>
    </section>` : ""}`;

  renderPending();
}

let pending = [];
function renderPending() {
  const box = document.getElementById("pending-attachments");
  if (!box) return;
  box.innerHTML = pending.map((a, i) => a.kind === "photo"
    ? `<figure class="thumb"><img src="data:${esc(a.mime)};base64,${a.data}" alt="${esc(a.name)}">
         <figcaption>${esc(a.name)} <button class="link danger" data-drop-pending="${i}">remove</button></figcaption></figure>`
    : `<span class="file-chip">📎 ${esc(a.name)}
         <button class="link danger" data-drop-pending="${i}">remove</button></span>`).join("");
}

function renderSettings() {
  const p = project();
  const settings = p.settings;
  const editable = canSetTrades(p);

  const tradeRows = settings.trades.map(trade => `
    <tr>
      <td><input data-trade="${esc(trade.id)}:name" value="${esc(trade.name)}" ${editable ? "" : "disabled"}></td>
      <td><input data-trade="${esc(trade.id)}:contactName" value="${esc(trade.contactName || "")}" ${editable ? "" : "disabled"}></td>
      <td><input data-trade="${esc(trade.id)}:email" value="${esc(trade.email || "")}" ${editable ? "" : "disabled"}></td>
      <td><input data-trade="${esc(trade.id)}:organization" value="${esc(trade.organization || "")}" ${editable ? "" : "disabled"}></td>
      <td>${editable ? `<button class="link danger" data-drop-trade="${esc(trade.id)}">Remove</button>` : ""}</td>
    </tr>`).join("");

  const memberRows = p.members.map(member => {
    const user = findUser(member.email);
    return `<tr>
      <td>${esc(user ? user.name : member.email)}<div class="muted">${esc(member.email)}</div></td>
      <td><select data-member="${esc(member.email)}:role" ${canManageMembers(p) ? "" : "disabled"}>
        ${ROLES.map(r => `<option ${member.role === r ? "selected" : ""}>${r}</option>`).join("")}</select></td>
      <td><select data-member="${esc(member.email)}:trade" ${canManageMembers(p) ? "" : "disabled"}>
        <option value="">All / none</option>
        ${settings.trades.map(t => `<option value="${esc(t.name)}" ${norm(t.name) === norm(member.trade) ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select></td>
      <td class="muted">${user && user.mustChange && isAdmin(p)
        ? `starting password <code>${esc(user.initialPassword || "")}</code>`
        : (user ? "password set by them" : "no account yet")}</td>
      <td>${canManageMembers(p) ? `<button class="link danger" data-drop-member="${esc(member.email)}">Remove</button>` : ""}</td>
    </tr>`;
  }).join("");

  const owner = findUser(p.createdBy);
  view().innerHTML = `
    <section class="card">
      <button class="back" data-go="project">${esc(p.name)}</button>
      <h1>Project settings</h1>
      <div class="grid-form">
        <label>Project name <input id="pj-name" value="${esc(p.name)}" ${isAdmin(p) ? "" : "disabled"}></label>
        <label>Administrator <input value="${esc(owner ? owner.name + " · " + owner.email : p.createdBy)}" disabled></label>
      </div>
      <p class="hint">Whoever creates the project administers it, whether that is the reviewer or the designer.</p>
    </section>

    <section class="card">
      <h2>People on this project</h2>
      <p class="hint">Adding someone by email creates their account here with a starting password you pass on to
      them; they change it the first time they sign in. A PM sees every comment. Anyone else sees only the
      comments for the trade you give them.</p>
      <table class="list">
        <thead><tr><th>Person</th><th>Role</th><th>Trade</th><th>Account</th><th></th></tr></thead>
        <tbody>${memberRows || '<tr><td colspan="5" class="muted">Nobody added yet.</td></tr>'}</tbody></table>
      ${canManageMembers(p) ? `
        <div class="grid-form">
          <label>Name <input id="mb-name"></label>
          <label>Email <input id="mb-email" type="email"></label>
          <label>Organization <input id="mb-org"></label>
          <label>Role <select id="mb-role">${ROLES.map(r => `<option>${r}</option>`).join("")}</select></label>
          <label>Trade <select id="mb-trade"><option value="">All / none</option>
            ${settings.trades.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("")}</select></label>
          <button class="primary" id="add-member">Add to project</button>
        </div>` : ""}
    </section>

    <section class="card">
      <h2>How comments appear</h2>
      <div class="modes">
        <label class="mode ${settings.mode === "live" ? "on" : ""}">
          <input type="radio" name="mode" value="live" ${settings.mode === "live" ? "checked" : ""} ${editable ? "" : "disabled"}>
          <strong>Live</strong><span>A comment or reply is part of the sheet the moment it is posted.</span></label>
        <label class="mode ${settings.mode === "published" ? "on" : ""}">
          <input type="radio" name="mode" value="published" ${settings.mode === "published" ? "checked" : ""} ${editable ? "" : "disabled"}>
          <strong>Published in batches</strong><span>Everything written stays a draft in its author's browser
          until they publish it.</span></label>
      </div>
      <label class="inline-field">Default due date, days from today
        <input type="number" id="due-days" min="1" max="180" value="${settings.dueDays}" ${editable ? "" : "disabled"}></label>
    </section>

    <section class="card">
      <h2>Trades and who replies</h2>
      <p class="hint">The trade is written into the sheet's Discipline column, and it is also what decides which
      comments each engineer is shown.</p>
      <table class="list">
        <thead><tr><th>Trade</th><th>Responsible</th><th>Email</th><th>Organization</th><th></th></tr></thead>
        <tbody>${tradeRows || '<tr><td colspan="5" class="muted">No trades yet.</td></tr>'}</tbody></table>
      ${editable ? '<p><button class="ghost" id="add-trade">Add a trade</button></p>' : ""}
    </section>`;
}

/* ------------------------------------------------------------------ *
 * Actions
 * ------------------------------------------------------------------ */
async function openFile(file) {
  const p = project();
  if (!p) return;
  try {
    const buffer = await file.arrayBuffer();
    const parsed = await parseWorkbook(buffer);
    const existing = p.sheets.find(s =>
      (parsed.info.drf_ref && s.info.drf_ref === parsed.info.drf_ref) ||
      s.title === (parsed.info.doc_title || file.name));

    if (existing && confirm(`This project already has “${existing.title}”. ` +
        "Merge the replies from this file into it? Cancel adds it as a separate sheet.")) {
      mergeInto(existing, parsed);
      ui.sheetId = existing.id; ui.view = "sheet";
      touch(); render();
      flash("Merged that file into the sheet you already had.");
      return;
    }

    const entry = {
      id: uid(), fileName: file.name,
      title: parsed.info.doc_title || parsed.info.drf_ref || file.name,
      layout: parsed.layout, info: parsed.info, comments: parsed.comments,
      workbook: bytesToBase64(parsed.template), savedAt: now(),
    };
    p.sheets.push(entry);
    if (parsed.settings) p.settings = { ...p.settings, ...parsed.settings };
    seedTrades(p);
    ui.sheetId = entry.id; ui.view = "sheet"; ui.filter = "all"; ui.query = "";
    save(); render();
    flash(`Imported ${parsed.comments.length} comments from ${file.name}` +
      (parsed.restored ? `, with ${parsed.restored} replies.` : "."));
  } catch (err) {
    flash(err.message, "error");
  }
}

function seedTrades(p) {
  const names = new Set();
  p.sheets.forEach(s => s.comments.forEach(c => { if ((c.trade || "").trim()) names.add(c.trade.trim()); }));
  names.forEach(name => {
    if (findTrade(p, name)) return;
    p.settings.trades.push({ id: uid(), name, contactName: "", email: "", organization: "" });
  });
}

function mergeInto(target, parsed) {
  const bySn = new Map(target.comments.map(c => [String(c.sn).trim(), c]));
  parsed.comments.forEach(incoming => {
    const mine = bySn.get(String(incoming.sn).trim());
    if (!mine) { target.comments.push(incoming); return; }
    const seen = new Set(mine.messages.map(m => m.id));
    (incoming.messages || []).forEach(message => { if (!seen.has(message.id)) mine.messages.push(message); });
    mine.messages.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    mine.trade = incoming.trade || mine.trade;
    mine.due = incoming.due || mine.due;
    mine.signoff = incoming.signoff || mine.signoff;
    const names = new Set((mine.attachments || []).map(a => a.name));
    (incoming.attachments || []).forEach(a => { if (!names.has(a.name)) mine.attachments.push(a); });
  });
}

async function exportSheet(kind, tradeOnly) {
  const p = project();
  const s = sheet();
  if (!s) return;
  let comments = visibleComments(p, s).map(v => v.c);
  if (tradeOnly) comments = comments.filter(c => norm(c.trade) === norm(tradeOnly));
  const counts = stats(comments);
  if (counts.drafts && !tradeOnly &&
      !confirm(`${counts.drafts} draft${counts.drafts > 1 ? "s stay" : " stays"} in this browser and will not be ` +
        "in the file. Export anyway?")) return;
  try {
    const bytes = await buildExport(base64ToBytes(s.workbook).buffer,
      { layout: s.layout, comments, settings: p.settings }, kind);
    const stem = s.fileName.replace(/\.(xlsx|xlsm)$/i, "").replace(/_(working|updated|[a-z ]+)$/i, "");
    const suffix = tradeOnly ? "_" + tradeOnly.replace(/\s+/g, "-").toLowerCase()
      : (kind === "working" ? "_working" : "_updated");
    download(bytes, `${stem}${suffix}.xlsx`);
    if (tradeOnly) flash(`That file holds ${comments.length} comment${comments.length === 1 ? "" : "s"}, ` +
      `only ${tradeOnly}'s. Send it to them and merge their file when it comes back.`);
  } catch (err) {
    flash("Export failed: " + err.message, "error");
  }
}

function emailTrade(name) {
  const p = project();
  const s = sheet();
  const trade = findTrade(p, name);
  if (!trade || !trade.email) return;
  const pool = s ? visibleComments(p, s).map(v => v.c)
    : p.sheets.flatMap(x => visibleComments(p, x).map(v => v.c));
  const open = pool.filter(c => !isClosed(c) && norm(c.trade) === norm(name) && !isDraft(c));
  const lines = open.map(c => `${c.sn}. ${c.observation}${c.due ? ` (due ${c.due})` : ""}`);
  const subject = `${(s && s.info.drf_ref) || p.name} — ${name}: ${open.length} open comment${open.length === 1 ? "" : "s"}`;
  const body = [`Dear ${trade.contactName || name},`, "",
    "The following comments are open and waiting on your reply:", "", ...lines, "",
    s ? `Document: ${s.info.doc_title || s.title}` : `Project: ${p.name}`, "", me().name].join("\n");
  window.location.href = `mailto:${encodeURIComponent(trade.email)}?subject=${encodeURIComponent(subject)}` +
    `&body=${encodeURIComponent(body)}`;
}

function pickFiles(handler) {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.accept = "image/*,.pdf,.doc,.docx,.xlsx,.dwg";
  input.addEventListener("change", async () => {
    for (const file of input.files) {
      try { handler(await readAttachment(file)); }
      catch (err) { flash(`Could not read ${file.name}: ${err.message}`, "error"); }
    }
    renderPending();
    render();
  });
  input.click();
}

/* -- auth actions ---------------------------------------------------- */

async function doSignIn() {
  const email = document.getElementById("si-email").value.trim();
  const password = document.getElementById("si-password").value;
  const user = findUser(email);
  if (!user || (await hashPassword(password, user.salt)) !== user.hash) {
    flash("That email and password do not match an account in this browser.", "error");
    return;
  }
  store.session = user.email;
  ui.view = "overview"; ui.projectId = null; ui.sheetId = null;
  save(); render();
}

async function doCreateAccount() {
  const value = id => document.getElementById(id).value.trim();
  const password = document.getElementById("cu-password").value;
  if (!value("cu-email") || !password) { flash("An email and a password are needed.", "error"); return; }
  if (password.length < 6) { flash("Use at least six characters for the password.", "error"); return; }
  try {
    const user = await createUser({
      name: value("cu-name"), email: value("cu-email"),
      organization: value("cu-org"), role: value("cu-role"), password,
    });
    store.session = user.email;
    adoptLegacySheets(user);
    ui.view = "overview";
    save(); render();
    flash(`Account created for ${user.email}.`);
  } catch (err) {
    flash(err.message, "error");
  }
}

async function doChangePassword() {
  const user = me();
  const current = document.getElementById("pw-current");
  const next = document.getElementById("pw-new").value;
  const again = document.getElementById("pw-again").value;
  if (current && (await hashPassword(current.value, user.salt)) !== user.hash) {
    flash("That is not your current password.", "error"); return;
  }
  if (next.length < 6) { flash("Use at least six characters.", "error"); return; }
  if (next !== again) { flash("The two new passwords are not the same.", "error"); return; }
  user.hash = await hashPassword(next, user.salt);
  user.mustChange = false;
  delete user.initialPassword;
  ui.view = "overview";
  save(); render();
  flash("Password changed.");
}

async function addMember() {
  const p = project();
  const value = id => document.getElementById(id).value.trim();
  const email = value("mb-email");
  if (!email) { flash("An email is needed.", "error"); return; }
  if (membership(p, email)) { flash("That person is already on this project.", "error"); return; }

  let user = findUser(email);
  let starting = null;
  if (!user) {
    starting = randomPassword();
    user = await createUser({
      name: value("mb-name"), email, organization: value("mb-org"),
      role: value("mb-role"), password: starting,
    });
    user.mustChange = true;
    user.initialPassword = starting;
  }
  p.members.push({ email: user.email, role: value("mb-role"), trade: value("mb-trade") });
  save(); render();
  flash(starting
    ? `Account created for ${email}. Their starting password is ${starting} — pass it on, and they change it when they first sign in.`
    : `${email} added to this project.`);
}

/* -- event wiring ---------------------------------------------------- */

document.addEventListener("click", event => {
  const target = event.target.closest("[data-auth],[data-go],[data-open-project],[data-open-sheet]," +
    "[data-delete-sheet],[data-open-comment],[data-toggle],[data-filter],[data-export],[data-move]," +
    "[data-email-trade],[data-send-trade],[data-drop-trade],[data-drop-member],[data-publish-message]," +
    "[data-publish-comment],[data-drop-attachment],[data-drop-pending]");
  if (!target) return;
  const data = target.dataset;
  const p = project();
  const s = sheet();

  if (data.auth) { ui.authTab = data.auth; render(); return; }
  if (data.go) {
    if (data.go === "overview") { ui.projectId = null; ui.sheetId = null; }
    if (data.go === "project") ui.sheetId = null;
    ui.view = data.go;
    render(); return;
  }
  if (data.openProject) { ui.projectId = data.openProject; ui.view = "project"; render(); return; }
  if (data.openSheet) { ui.sheetId = data.openSheet; ui.view = "sheet"; ui.filter = "all"; ui.query = ""; render(); return; }
  if (data.deleteSheet) {
    event.stopPropagation();
    if (!confirm("Delete this sheet and its replies from this browser?")) return;
    p.sheets = p.sheets.filter(x => x.id !== data.deleteSheet);
    save(); render(); return;
  }
  if (data.openComment !== undefined) { ui.commentIndex = +data.openComment; ui.view = "comment"; pending = []; render(); return; }
  if (data.toggle !== undefined) {
    event.stopPropagation();
    const comment = s.comments[+data.toggle];
    comment.signoff = isClosed(comment) ? "Open" : "Closed";
    touch(); render(); return;
  }
  if (data.filter) { ui.filter = data.filter; render(); return; }
  if (data.export) { exportSheet(data.export, null); return; }
  if (data.sendTrade) { exportSheet("working", data.sendTrade); return; }
  if (data.move) {
    const allowed = visibleComments(p, s);
    const here = allowed.findIndex(v => v.i === ui.commentIndex);
    const next = allowed[Math.min(Math.max(here + (+data.move), 0), allowed.length - 1)];
    if (next) ui.commentIndex = next.i;
    pending = []; render(); return;
  }
  if (data.emailTrade) { emailTrade(data.emailTrade); return; }
  if (data.dropTrade) { p.settings.trades = p.settings.trades.filter(t => t.id !== data.dropTrade); save(); render(); return; }
  if (data.dropMember) { p.members = p.members.filter(m => norm(m.email) !== norm(data.dropMember)); save(); render(); return; }
  if (data.publishComment) { s.comments[ui.commentIndex].published = true; touch(); render(); flash("Comment published."); return; }
  if (data.publishMessage) {
    const message = s.comments[ui.commentIndex].messages.find(m => m.id === data.publishMessage);
    if (message) message.published = true;
    touch(); render(); return;
  }
  if (data.dropAttachment) {
    const [owner, id] = data.dropAttachment.split(":");
    const comment = s.comments[ui.commentIndex];
    if (owner.startsWith("c")) comment.attachments = comment.attachments.filter(a => a.id !== id);
    else {
      const message = comment.messages.find(m => "m" + m.id === owner);
      if (message) message.attachments = (message.attachments || []).filter(a => a.id !== id);
    }
    touch(); render(); return;
  }
  if (data.dropPending !== undefined) { pending.splice(+data.dropPending, 1); renderPending(); return; }
});

document.addEventListener("click", event => {
  const id = event.target.id;
  if (!id) return;
  const p = project();
  const s = sheet();

  if (id === "do-signin") { doSignIn(); return; }
  if (id === "do-create") { doCreateAccount(); return; }
  if (id === "do-password") { doChangePassword(); return; }
  if (id === "sign-out") {
    document.getElementById("flashes").innerHTML = "";  // starting passwords do not linger
    store.session = null; ui.view = "signin"; ui.authTab = "signin";
    ui.projectId = null; ui.sheetId = null; ui.commentIndex = null;
    save(); render(); return;
  }
  if (id === "save-account") {
    const user = me();
    user.name = document.getElementById("ac-name").value.trim() || user.name;
    user.organization = document.getElementById("ac-org").value.trim();
    user.role = document.getElementById("ac-role").value;
    save(); render(); flash("Account saved.");
    return;
  }
  if (id === "new-project") {
    const name = prompt("Name this project");
    if (!name) return;
    const created = newProject(name.trim(), store.session);
    store.projects.push(created);
    ui.projectId = created.id; ui.view = "project";
    save(); render();
    flash("Project created. You administer it, so add the other side's people in the project settings.");
    return;
  }
  if (!p) return;

  if (id === "open-file") { document.getElementById("file-input").click(); return; }
  if (id === "add-trade") {
    p.settings.trades.push({ id: uid(), name: "New trade", contactName: "", email: "", organization: "" });
    save(); render(); return;
  }
  if (id === "add-member") { addMember(); return; }

  if (id === "publish-all") {
    const email = norm(store.session);
    s.comments.forEach(comment => {
      if (norm(comment.authorEmail) === email || seesAll(p)) comment.published = true;
      (comment.messages || []).forEach(m => {
        if (norm(m.authorEmail) === email || seesAll(p)) m.published = true;
      });
    });
    touch(); render(); flash("Published.");
    return;
  }

  if (id === "attach-reply") { pickFiles(a => pending.push(a)); return; }
  if (id === "attach-comment") { pickFiles(a => s.comments[ui.commentIndex].attachments.push(a)); touch(); return; }

  if (id === "add-comment") {
    const observation = document.getElementById("nc-observation").value.trim();
    if (!observation) { flash("A comment needs some text.", "error"); return; }
    const value = key => document.getElementById(key).value.trim();
    s.comments.push({
      id: uid(),
      sn: value("nc-sn") || String(s.comments.length + 1),
      reviewer: value("nc-reviewer") || me().name,
      authorEmail: me().email,
      source: value("nc-source"),
      observation,
      trade: value("nc-trade"),
      discipline: value("nc-trade"),
      due: value("nc-due"),
      reference: value("nc-reference"),
      returned_code: value("nc-code"),
      response: "", originalResponse: "", signoff: "Open",
      published: p.settings.mode === "live",
      messages: [], attachments: [],
    });
    ui.commentIndex = s.comments.length - 1;
    ui.view = "comment";
    pending = [];
    touch(); render();
    flash(p.settings.mode === "live" ? "Comment added." : "Comment saved as a draft.");
    return;
  }

  if (id === "post-reply") {
    const body = document.getElementById("reply-body").value.trim();
    if (!body && !pending.length) { flash("Write something before posting.", "error"); return; }
    const comment = s.comments[ui.commentIndex];
    const role = roleIn(p);
    comment.messages.push({
      id: uid(), author: me().name, authorEmail: me().email, role,
      organization: me().organization || "", body, at: now(),
      published: p.settings.mode === "live",
      attachments: pending.slice(),
    });
    pending = [];
    if (!REVIEWER_ROLES.includes(role)) comment.response = body;
    if (document.getElementById("reply-close").checked) comment.signoff = "Closed";
    else if (isClosed(comment)) comment.signoff = "Open";
    touch(); render();
    return;
  }

  if (id === "save-comment") {
    const comment = s.comments[ui.commentIndex];
    const value = key => document.getElementById(key).value.trim();
    Object.assign(comment, {
      sn: value("ec-sn"), reviewer: value("ec-reviewer"), source: value("ec-source"),
      reference: value("ec-reference"), returned_code: value("ec-code"),
      signoff: value("ec-signoff"), observation: value("ec-observation"),
    });
    touch(); render(); flash("Comment updated.");
    return;
  }

  if (id === "delete-comment") {
    if (!confirm("Delete this comment and its thread?")) return;
    s.comments.splice(ui.commentIndex, 1);
    ui.view = "sheet";
    touch(); render();
    return;
  }
});

document.addEventListener("change", event => {
  const element = event.target;
  const p = project();
  const s = sheet();
  if (!p) return;

  if (element.id === "pj-name") { p.name = element.value.trim() || p.name; save(); render(); return; }
  if (element.id === "assign-trade") {
    const comment = s.comments[ui.commentIndex];
    comment.trade = element.value;
    comment.discipline = element.value;
    touch(); render(); return;
  }
  if (element.id === "assign-due") { s.comments[ui.commentIndex].due = element.value; touch(); render(); return; }
  if (element.id === "due-days") { p.settings.dueDays = +element.value || 14; save(); return; }
  if (element.name === "mode") { p.settings.mode = element.value; save(); render(); return; }

  if (element.dataset.trade) {
    const [id, field] = element.dataset.trade.split(":");
    const trade = p.settings.trades.find(t => t.id === id);
    if (trade) { trade[field] = element.value.trim(); save(); }
    return;
  }
  if (element.dataset.member) {
    const [email, field] = element.dataset.member.split(":");
    const member = membership(p, email);
    if (member) { member[field] = element.value; save(); render(); }
    return;
  }
});

document.getElementById("file-input").addEventListener("change", event => {
  const file = event.target.files[0];
  event.target.value = "";
  if (file) openFile(file);
});

document.getElementById("brand").addEventListener("click", () => {
  if (!me()) return;
  ui.projectId = null; ui.sheetId = null; ui.view = "overview";
  render();
});

if (typeof CompressionStream === "undefined" || typeof DecompressionStream === "undefined") {
  flash("This browser is too old to read and write Excel files here. Use a current Chrome, Edge or Safari.", "error");
}

load();
render();
</script>
