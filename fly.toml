# fly.toml app configuration file generated for project-management-cv5qig on 2026-09-02T08:02:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-management-cv5qig'
# The machine and its data volume live here. If this does not match the
# region the volume is in, a deploy can create a second machine with a
# second, empty volume — two copies of the database that silently diverge.
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOW_SIGNUP = 'true'
  DATA_DIR = '/data'
  HTTPS_ONLY = 'true'
  PORT = '8080'

[[mounts]]
  source = 'project_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
