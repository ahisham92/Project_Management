services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATA_DIR: /data
      # Set this before exposing the app to the internet:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or a .env file}
      # Turn on once the app is served over HTTPS.
      HTTPS_ONLY: ${HTTPS_ONLY:-false}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    volumes:
      - pm-data:/data
    restart: unless-stopped

volumes:
  pm-data:
