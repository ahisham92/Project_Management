name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the app starts and answers its health check
        run: |
          SECRET_KEY=ci-only python run.py seed
          SECRET_KEY=ci-only PORT=8000 python run.py &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"status": *"ok"'
