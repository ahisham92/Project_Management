services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_DIR: /data
      # Change this before exposing the app to the internet.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your environment or a .env file}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    volumes:
      - pm-data:/data
    restart: unless-stopped

volumes:
  pm-data:
