# Publishes the landing page in docs/ to GitHub Pages.
#
# Pages serves static files only, so it cannot run this application — the page
# it publishes is a front door that links to wherever the app is hosted.
name: Landing page

on:
  push:
    branches: ["main", "master", "claude/project-management-app-dowwzs"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
